<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Mon espace — Nardjis</title><link rel="icon" href="/static/favicon.png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><script src="/static/brand.js"></script><script src="/static/download.js"></script><meta name="theme-color" content="#102D50"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/site.css">
<style>
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}.kp .card{padding:14px}.kp b{font-size:26px;letter-spacing:-.03em;display:block}.kp span{font-size:12px;color:var(--mute)}
.tbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.t{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 16px;position:relative;overflow:hidden}.t::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c,#c9d4e0)}
.t b{display:block}.t small{color:var(--mute)}.t em{font:700 24px inherit;font-style:normal;letter-spacing:-.03em;display:block;margin-top:4px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);text-align:left;padding:8px 10px}td{padding:10px;border-top:1px solid var(--line)}
td select{padding:6px 8px}.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(16,45,80,.09);color:var(--a2)}.chip.ok{background:#e3f3ea;color:var(--ok)}
.bar{height:6px;border-radius:9px;background:rgba(16,45,80,.12);margin-top:5px}.bar i{display:block;height:100%;border-radius:9px;background:var(--a1)}
.hb{display:flex;align-items:flex-end;gap:3px;height:70px}.hb i{flex:1;background:var(--a1);border-radius:3px 3px 0 0;min-height:2px}.hl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
body{background:radial-gradient(900px 420px at 90% -8%,#cfeeed,transparent 70%),radial-gradient(700px 400px at -5% 30%,#e4f6f5,transparent 70%),var(--bg)}
.hero2{background:linear-gradient(135deg,#1a4a7c,#0a1f38);color:#fff;border-radius:22px;padding:24px 28px;margin-bottom:18px;box-shadow:0 24px 50px -28px rgba(16,45,80,.8);position:relative;overflow:hidden}
.hero2::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero2 h1{font-size:25px;letter-spacing:-.02em}.hero2 p{opacity:.85;margin-top:4px}
.tabs{background:#fff;box-shadow:0 6px 20px -12px rgba(16,45,80,.5)}.tabs button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:none}
.card{transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px)}
.kp .card{padding:16px}.kp b{font-size:30px}.ic{font-style:normal;display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#d6f0ef,#bfe9e6);margin-bottom:10px;font-size:19px;color:var(--a2)}
.rk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-size:12px;font-weight:700;margin-right:7px}.card h2{margin-bottom:12px}.bar{height:9px}.bar i{background:linear-gradient(90deg,var(--a1),#00b8b0)}
.hb{height:90px}.hb i{background:linear-gradient(180deg,#00b8b0,var(--a2))}
.demo{background:#fff6dd;border:1px solid #f0d58a;color:#7a5a00;border-radius:12px;padding:9px 14px;margin-top:14px;font-size:13px}
#v>*{animation:up .35s ease both}#v.still>*{animation:none}@keyframes up{from{opacity:0;transform:translateY(8px)}}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.row label{flex:1;min-width:150px}code{background:#e6edf5;padding:3px 8px;border-radius:7px;font-weight:700}
</style></head>
<body><header class="hdr"><a class="brand" href="/"><img src="/static/emblem.png" alt="" onerror="this.remove()"><b id="bn">…</b></a><span class="chip" id="bt"></span><span class="sp"></span><a class="btn sm" id="dlh" href="#" download style="margin-right:8px">Télécharger l’app</a><button class="btn ghost sm" id="out">Déconnexion</button></header>
<main class="wrap" style="padding-top:24px"><div class="hero2" id="hr"><h1>Bonjour</h1><p>Votre salle en un coup d’œil.</p></div><div class="tabs" id="tb" style="max-width:420px"><button data-t="room" class="on">Salle</button><button data-t="rep">Rapports</button><button data-t="staff">Employés</button><button data-t="acc">Compte</button></div><div id="v"></div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),mm=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const api=async(op,body)=>{const r=await fetch("/api?op="+op,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(r.status===401){location.href="/";throw 0}if(!r.ok)throw new Error("err");return r.json()};
const SV={eye:'<circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/>',hourglass:'<path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',bell:'<path d="M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21h4"/>',users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/>',check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',exit:'<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>',sparkle:'<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>',drop:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>'},I=n=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${SV[n]}</svg>`;
const TYPES={restaurant:"Restaurant",cafeteria:"Cafétéria",other:"Autre"},ROLES={waiter:"Serveur",cleaner:"Nettoyage",cook:"Cuisine",manager:"Responsable",other:"Autre"},SL={free:"Libre",occupied:"Servi",waiting:"En attente",dirty:"À nettoyer"};
(()=>{const a=document.getElementById("dlh"),u=(window.NARDJIS_DOWNLOAD||{}).url;
  if(u)a.href=u;else{a.removeAttribute("href");a.removeAttribute("download");a.textContent="App Windows : bientôt disponible";a.style.opacity=".55";a.style.pointerEvents="none"}})();
let PAIR="";
const getPair=async()=>{if(!PAIR){try{PAIR=(await api("m_pair")).code||""}catch{}}return PAIR};
const cp=t=>{try{navigator.clipboard.writeText(t)}catch{}};
let ME,tab="room",timer,note="";
const COL={occupied:"#17704a",waiting:"#d98a1b",dirty:"#5b6b7f"};
let lastRoom="";
function morph(a,b){
  const A=[...a.childNodes],B=[...b.childNodes];
  B.forEach((nb,i)=>{const na=A[i];
    if(!na){a.appendChild(nb.cloneNode(true));return}
    if(na.nodeType!==nb.nodeType||na.nodeName!==nb.nodeName){a.replaceChild(nb.cloneNode(true),na);return}
    if(nb.nodeType===3){if(na.nodeValue!==nb.nodeValue)na.nodeValue=nb.nodeValue;return}
    [...na.attributes].forEach(x=>{if(!nb.hasAttribute(x.name))na.removeAttribute(x.name)});
    [...nb.attributes].forEach(x=>{if(na.getAttribute(x.name)!==x.value)na.setAttribute(x.name,x.value)});
    morph(na,nb)});
  while(a.childNodes.length>B.length)a.removeChild(a.lastChild)}
const paint=h=>{const v=$("#v");if(h===lastRoom)return;const first=lastRoom==="";lastRoom=h;v.classList.toggle("still",!first);
  if(first){v.innerHTML=h;return}
  const t=document.createElement("div");t.innerHTML=h;morph(v,t)};
async function room(){
  let s;try{s=await api("m_state")}catch{return}if(tab!=="room")return;
  if(s.waiting&&!s.tables){const D=window.NARDJIS_DOWNLOAD||{};return paint(`<div class="card" style="margin-top:16px"><h2>En attente de votre système caméra</h2><p class="muted">Votre salle apparaîtra ici dès que le système sera installé et connecté. Installez l’application sur l’ordinateur de votre salle, puis entrez cet identifiant, ce code d’appairage et l’adresse IP de la caméra :</p><p style="margin-top:12px">Identifiant : <code>${esc(ME.restaurant_id)}</code></p><p style="margin-top:8px">Code d’appairage : <code>${esc(await getPair()||"…")}</code></p>${D.url?`<p style="margin-top:16px"><a class="btn" href="${esc(D.url)}" download>Télécharger l’application pour Windows</a></p>`:""}</div>`)}
  const k=s.kpi||{},mx=Math.max(1,...(s.staff||[]).map(x=>x.effort));
  paint(`<div class="kp">${[["À surveiller",k.attention??0,"eye"],["Attente la plus longue",k.longest_wait_now!=null?mm(k.longest_wait_now):"–","hourglass"],["Attente moyenne",k.avg_wait!=null?mm(k.avg_wait):"–","clock"],["Alertes",k.alerts??0,"bell"]].map(([l,v,ic])=>`<div class="card"><i class="ic">${I(ic)}</i><b>${v}</b><span>${l}</span></div>`).join("")}</div>
  <div class="tbs">${(s.tables||[]).map(x=>{const sec=x.state==="waiting"?x.wait:x.state==="dirty"?x.dirty:x.state==="occupied"?x.seated:0,c=x.level==="critical"?"#b3261e":COL[x.state];return`<div class="t" style="--c:${c||"#c9d4e0"}"><b>${esc(x.name)}</b><small>${SL[x.state]||""}${x.clients?" · "+x.clients+" pers.":""}</small><em>${x.state==="free"?"—":mm(sec)}</em></div>`}).join("")}</div>
  <div class="card" style="margin-top:16px"><h2>Effort de l’équipe</h2>${(s.staff||[]).map(x=>`<p style="margin-top:10px"><b>${esc(x.name)}</b> <span class="muted">· ${x.visits} visites · ${x.tasks_done} tâches</span><span class="bar"><i style="width:${100*x.effort/mx}%"></i></span></p>`).join("")||'<p class="muted">Rien pour l’instant.</p>'}</div>`);
}
async function staff(){
  const l=await api("m_staff");if(tab!=="staff")return;
  $("#v").innerHTML=`<div class="card" style="margin-top:16px"><h2>Ajouter un employé</h2><form class="row" id="fa"><label>Nom<input name="name" required maxlength="60"></label><label>Rôle<select name="role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label><button class="btn">Créer l’identifiant</button></form><p class="muted" style="margin-top:8px;font-size:13px">L’employé se connecte sur la page d’accueil, onglet « Employé », avec son identifiant et son code PIN. Il reçoit uniquement les alertes de tables en attente ou à nettoyer.</p><p class="err" id="ae"></p></div>${note?`<div class="card" style="margin-top:16px;background:#e3f3ea">${note}</div>`:""}
  <div class="card" style="margin-top:16px;overflow:auto"><table><tr><th>Identifiant</th><th>Nom</th><th>Rôle</th><th>Statut</th><th></th></tr>${l.map(m=>`<tr><td><code>${esc(m.emp_code)}</code></td><td>${esc(m.name)}</td><td><select data-r="${m.id}">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${m.role===k?"selected":""}>${v}</option>`).join("")}</select></td><td><button class="btn ghost sm" data-a="${m.id}" data-v="${!m.active}"><span class="chip ${m.active?"ok":""}">${m.active?"Actif":"Désactivé"}</span></button></td><td style="white-space:nowrap"><button class="btn ghost sm" data-p="${m.id}">Nouveau PIN</button> <button class="btn red sm" data-d="${m.id}">Supprimer</button></td></tr>`).join("")||'<tr><td colspan="5" class="muted">Aucun employé pour l’instant.</td></tr>'}</table></div>`;
  $("#fa").onsubmit=async e=>{e.preventDefault();try{const r=await api("m_staff_add",Object.fromEntries(new FormData(e.target)));note=`Employé créé : identifiant <code>${esc(r.emp_code)}</code> · code PIN <code>${esc(r.pin)}</code><br><span class="muted">Notez le PIN maintenant : il ne sera plus affiché.</span>`;staff()}catch{$("#ae").textContent="Impossible d’ajouter."}};
  document.querySelectorAll("[data-r]").forEach(x=>x.onchange=()=>api("m_staff_edit",{id:x.dataset.r,role:x.value}));
  document.querySelectorAll("[data-a]").forEach(x=>x.onclick=async()=>{await api("m_staff_edit",{id:x.dataset.a,active:x.dataset.v==="true"});staff()});
  document.querySelectorAll("[data-p]").forEach(x=>x.onclick=async()=>{const r=await api("m_staff_edit",{id:x.dataset.p,reset_pin:true});note=`Nouveau code PIN : <code>${esc(r.pin)}</code><br><span class="muted">Notez-le maintenant : il ne sera plus affiché.</span>`;staff()});
  document.querySelectorAll("[data-d]").forEach(x=>x.onclick=async()=>{if(confirm("Supprimer cet employé ?")){await api("m_staff_del",{id:x.dataset.d});staff()}});
}
const demoData=()=>{const n=[52,61,48,70,66,88,27],H=Array.from({length:24},(_,h)=>h>=11&&h<=15?60+h*2:h>=19&&h<=22?70-h:h>=8&&h<24?12:0);return{kpi:{seated:412,served:388,avg_wait:150,left_unserved:9,cleaned:371,avg_clean:84},days:n.map((s,i)=>({day:"Jour "+(i+1),seated:s,avg_wait:120+i*9,left_unserved:i%3})),hours:H,peak_hour:13,tables:[12,11,9,8,6,4,2].map((u,i)=>({name:"Table "+(i+1),uses:u*9})),unused:["Table 8"],staff:[["Sara",120,95],["Yacine",104,88],["Amel",81,70],["Karim",60,52]].map(([name,served,cleaned])=>({name,served,cleaned,points:served+cleaned,avg_response:70+served%40})),weekly_best:[{week:"2026-10-19",name:"Sara",points:54},{week:"2026-10-26",name:"Yacine",points:61},{week:"2026-11-02",name:"Sara",points:58}]}};
async function rep(d=30,demo=false){
  const r=demo?demoData():await api("m_report&days="+d);if(tab!=="rep")return;const k=r.kpi,mx=(a,f)=>Math.max(1,...a.map(f)),m=n=>n==null?"–":mm(n),top=r.staff[0],wk=r.weekly_best[r.weekly_best.length-1],hm=Math.max(1,...r.hours);
  const bars=(a,f,g,md)=>a.map((x,i)=>`<p style="margin-top:11px">${md&&i<3?`<span class="rk">${i+1}</span>`:""}<b>${esc(x.name||x.day)}</b> <span class="muted">· ${g(x)}</span><span class="bar"><i style="width:${100*f(x)/mx(a,f)}%"></i></span></p>`).join("");
  $("#v").innerHTML=`<div class="row" style="margin-top:16px"><button class="btn ghost" id="dm">${demo?"Quitter l’exemple":"Voir un exemple"}</button><label style="max-width:220px">Période<select id="pd">${[[7,"7 derniers jours"],[30,"30 derniers jours"],[90,"90 derniers jours"]].map(([v,l])=>`<option value="${v}" ${v===d?"selected":""}>${l}</option>`).join("")}</select></label></div>${demo?`<div class="demo">Aperçu avec des données d’exemple : ce ne sont pas vos chiffres.</div>`:""}
  <div class="kp">${[["Clients installés",k.seated,"users"],["Clients servis",k.served,"check"],["Attente moyenne",m(k.avg_wait),"clock"],["Partis sans service",k.left_unserved,"exit"],["Tables nettoyées",k.cleaned,"sparkle"],["Temps moyen de nettoyage",m(k.avg_clean),"drop"],["Heure de pointe",r.peak_hour==null?"–":r.peak_hour+"h","trend"]].map(([l,v,ic])=>`<div class="card"><i class="ic">${I(ic)}</i><b>${v}</b><span>${l}</span></div>`).join("")}</div>
  <div class="card"><h2>Meilleurs employés</h2><p>${wk?`Cette semaine : <b>${esc(wk.name)}</b> (${wk.points} actions)`:'<span class="muted">Pas encore de données.</span>'}</p><p>${top?`Sur la période : <b>${esc(top.name)}</b> (${top.points} actions)`:""}</p>
  ${r.weekly_best.length?`<p class="muted" style="margin-top:10px;font-size:13px">Meilleur de chaque semaine : ${r.weekly_best.map(w=>`${w.week} → ${esc(w.name)}`).join(" · ")}</p>`:""}</div>
  <div class="card" style="margin-top:16px"><h2>Efficacité des employés</h2>${bars(r.staff,x=>x.points,x=>`${x.served} servis · ${x.cleaned} nettoyages · réaction moy. ${m(x.avg_response)}`,1)||'<p class="muted">Rien pour l’instant.</p>'}</div>
  <div class="card" style="margin-top:16px"><h2>Tables les plus utilisées</h2>${bars(r.tables,x=>x.uses,x=>x.uses+" fois")||'<p class="muted">Rien pour l’instant.</p>'}${r.unused.length?`<p style="margin-top:14px"><b>Jamais utilisées :</b> ${r.unused.map(n=>`<span class="chip">${esc(n)}</span>`).join(" ")}</p>`:""}</div>
  <div class="card" style="margin-top:16px"><h2>Affluence par heure</h2><div class="hb">${r.hours.map(h=>`<i style="height:${100*h/hm}%" title="${h}"></i>`).join("")}</div><div class="hl"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span></div></div>
  <div class="card" style="margin-top:16px"><h2>Clients par jour</h2>${bars([...r.days].reverse(),x=>x.seated,x=>`${x.seated} clients · attente moy. ${m(x.avg_wait)} · ${x.left_unserved} partis`)||'<p class="muted">Rien pour l’instant.</p>'}</div>`;
  $("#pd").onchange=e=>rep(+e.target.value,demo);$("#dm").onclick=()=>rep(d,!demo)}
async function acc(){const pc=await getPair();if(tab!=="acc")return;$("#v").innerHTML=`<div class="card" style="margin-top:16px;max-width:520px"><h2>Mon compte</h2>${[["Établissement",ME.business_name],["Type",TYPES[ME.business_type]||ME.business_type],["Ville",ME.city||"—"],["Responsable",ME.manager_name],["E-mail",ME.email],["Identifiant de l’établissement",`<code>${esc(ME.restaurant_id)}</code>`]].map(([l,v])=>`<p style="margin-top:10px"><span class="muted">${l}</span><br><b>${l.startsWith("Identifiant")?v:esc(v)}</b></p>`).join("")}</div><div class="card" style="margin-top:16px;max-width:520px"><h2>Code d’appairage</h2><p class="muted">Il relie l’application Windows de votre salle à votre espace. Ne le partagez pas.</p><p style="margin-top:12px"><code id="pc">${esc(pc||"—")}</code> <button class="btn ghost sm" id="pcc">Copier</button> <button class="btn ghost sm" id="pcn">Nouveau code</button></p><p class="muted" id="pcm" style="margin-top:8px;font-size:13px"></p></div>${(window.NARDJIS_DOWNLOAD||{}).url?`<div class="card" style="margin-top:16px;max-width:520px"><h2>Application Windows</h2><p class="muted">À installer sur l’ordinateur de votre salle. Dans l’application, entrez votre identifiant, le code d’appairage ci-dessous et l’adresse IP de la caméra.</p><p style="margin-top:12px"><a class="btn" href="${esc(window.NARDJIS_DOWNLOAD.url)}" download>Télécharger l’application pour Windows</a></p></div>`:""}`;
  $("#pcc").onclick=()=>{cp(PAIR);$("#pcm").textContent="Copié."};
  $("#pcn").onclick=async()=>{if(!confirm("Créer un nouveau code ? L’ancien code cessera de fonctionner : il faudra saisir le nouveau dans l’application."))return;
    try{PAIR=(await api("m_pair_reset",{})).code;$("#pc").textContent=PAIR;$("#pcm").textContent="Nouveau code créé. Saisissez-le dans l’application Windows."}catch{$("#pcm").textContent="Impossible pour l’instant."}}
}
function go(t){tab=t;note="";lastRoom="";$("#v").classList.remove("still");clearInterval(timer);document.querySelectorAll("#tb button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  if(t==="room"){room();timer=setInterval(room,3000)}else if(t==="rep")rep();else if(t==="staff")staff();else acc()}
document.querySelectorAll("#tb button").forEach(b=>b.onclick=()=>go(b.dataset.t));
$("#out").onclick=async()=>{await fetch("/api?op=m_logout",{method:"POST"});location.href="/"};
api("m_me").then(m=>{ME=m;$("#hr").innerHTML=`<h1>Bonjour ${esc(m.manager_name)}</h1><p>${esc(m.business_name)} · ${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</p>`;$("#bn").textContent=m.business_name;$("#bt").textContent=TYPES[m.business_type]||"";go("room")});
</script></body></html>
