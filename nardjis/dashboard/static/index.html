<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F8F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Nardjis · Platform</title>
<link rel="icon" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Nardjis Platform — Ink & Jade design system
   ============================================================ */
:root{
  --bg:#F5F8F7; --surface:#FFFFFF; --surface-2:#EEF3F1; --surface-3:#E5EDEA;
  --ink:#0F1E1A; --ink-2:#2E423C; --muted:#6B7F79; --faint:#93A5A0;
  --line:#DFE8E4; --line-2:#EDF2F0;
  --jade:#0E7C66; --jade-2:#0A5B4B; --jade-soft:rgba(14,124,102,.10); --jade-line:rgba(14,124,102,.30);
  --amber:#8F6412; --amber-soft:rgba(143,100,18,.11); --amber-line:rgba(143,100,18,.30);
  --clay:#A24038; --clay-soft:rgba(162,64,56,.10); --clay-line:rgba(162,64,56,.30);
  --slate:#3F6172; --slate-soft:rgba(63,97,114,.10); --slate-line:rgba(63,97,114,.28);
  --shadow:0 1px 2px rgba(15,30,26,.05), 0 12px 32px -20px rgba(15,30,26,.40);
  --shadow-lg:0 24px 60px -30px rgba(15,30,26,.45);
  --r:14px; --r-sm:10px; --r-xs:7px;
  --side-w:248px; --top-h:60px;
  --ring-track:#E7EDEA;
}
html[data-theme=dark]{
  --bg:#0D1413; --surface:#141D1B; --surface-2:#1A2422; --surface-3:#212D2A;
  --ink:#E7EFEC; --ink-2:#C3D1CD; --muted:#8B9E99; --faint:#6C7E7A;
  --line:#233130; --line-2:#1B2624;
  --jade:#45D0B2; --jade-2:#77E5CC; --jade-soft:rgba(69,208,178,.13); --jade-line:rgba(69,208,178,.34);
  --amber:#E3B661; --amber-soft:rgba(227,182,97,.13); --amber-line:rgba(227,182,97,.34);
  --clay:#E48B81; --clay-soft:rgba(228,139,129,.13); --clay-line:rgba(228,139,129,.34);
  --slate:#8FB4C6; --slate-soft:rgba(143,180,198,.13); --slate-line:rgba(143,180,198,.32);
  --ring-track:#25322F;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 36px -22px rgba(0,0,0,.8);
  --shadow-lg:0 26px 70px -34px rgba(0,0,0,.9);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .25s ease,color .25s ease;
}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:15px;height:15px}
svg.i.lg{width:22px;height:22px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ================= layout ================= */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;background:var(--surface);border-inline-end:1px solid var(--line);
  display:flex;flex-direction:column;z-index:60;overflow:hidden
}
.side-head{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.mark{width:34px;height:34px;border-radius:9px;object-fit:contain;flex:none}
.mark.lg{width:76px;height:76px;border-radius:18px}
.side-badge{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.side-badge b{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.side-badge span{font-size:11px;color:var(--muted);font-weight:500}
.nav{flex:1;overflow-y:auto;padding:6px 10px 14px;display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);
  font-size:13.5px;font-weight:500;color:var(--ink-2);position:relative;transition:background .15s,color .15s
}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--jade-soft);color:var(--jade);font-weight:600}
.nav a.on::before{content:"";position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--jade)}
.nav a .cnt{margin-inline-start:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--surface-3);color:var(--muted)}
.nav a.on .cnt{background:var(--jade-soft);color:var(--jade)}
.nav a .cnt.warn{background:var(--amber-soft);color:var(--amber)}
.side-foot{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}
.who{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r-sm);background:var(--surface-2)}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--jade);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.who .tx{min-width:0}
.who .tx b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .tx span{font-size:11px;color:var(--muted)}

.main{display:flex;flex-direction:column;min-width:0}
.top{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)
}
.top-in{display:flex;align-items:center;gap:10px;min-height:var(--top-h);padding:8px 20px;max-width:1440px;margin:auto;width:100%}
.crumb{display:flex;flex-direction:column;min-width:0}
.crumb b{font-size:15.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.view{padding:20px;max-width:1440px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px}

/* ================= controls ================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--jade);color:#fff;border:1px solid transparent;border-radius:var(--r-sm);
  padding:0 14px;min-height:38px;font-size:13.5px;font-weight:600;letter-spacing:-.005em;
  transition:background .15s,transform .08s,box-shadow .15s;white-space:nowrap
}
.btn:hover{background:var(--jade-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.soft{background:var(--jade-soft);color:var(--jade);border-color:transparent}
.btn.soft:hover{background:var(--jade-soft);filter:brightness(.97)}
.btn.danger{background:var(--clay-soft);color:var(--clay);border-color:transparent}
.btn.danger:hover{filter:brightness(.97)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:var(--r-xs)}
.btn.lg{min-height:44px;padding:0 18px;font-size:14.5px}
.btn.block{width:100%}
.ibtn{
  display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);transition:background .15s,color .15s
}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn.bare{border-color:transparent;background:transparent}
.ibtn.bare:hover{background:var(--surface-2)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{padding:0 12px;min-height:30px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,30,26,.10)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.inp,select.inp,textarea.inp{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:0 12px;min-height:38px;font-size:13.5px;color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s
}
textarea.inp{padding:10px 12px;min-height:80px;resize:vertical}
.inp:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-soft)}
.inp::placeholder{color:var(--faint)}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%236B7F79' stroke-width='2' stroke-linecap='round'><path d='M3 5l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-inline-end:30px}
html[dir=rtl] select.inp{background-position:left 11px center}
.switch{position:relative;display:inline-flex;flex:none;width:40px;height:23px;border-radius:99px;background:var(--surface-3);transition:background .18s;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .18s}
.switch.on{background:var(--jade)}
.switch.on::after{transform:translateX(17px)}
html[dir=rtl] .switch.on::after{transform:translateX(-17px)}
.search{position:relative;flex:1;min-width:160px;max-width:340px}
.search .inp{padding-inline-start:36px}
.search svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}

/* dropdown menu (globe / user / row actions) */
.menu-wrap{position:relative}
.menu{
  position:absolute;top:calc(100% + 7px);inset-inline-end:0;min-width:190px;z-index:80;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-lg);padding:6px;display:flex;flex-direction:column;gap:1px;
  animation:pop .14s ease
}
@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.menu.align-start{inset-inline-end:auto;inset-inline-start:0}
.menu-h{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:7px 9px 4px}
.menu button,.menu a{
  display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;
  font-size:13.5px;color:var(--ink-2);text-align:start;width:100%
}
.menu button:hover,.menu a:hover{background:var(--surface-2);color:var(--ink)}
.menu button.on{color:var(--jade);font-weight:600;background:var(--jade-soft)}
.menu .tick{margin-inline-start:auto;opacity:0}
.menu button.on .tick{opacity:1}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu button.danger{color:var(--clay)}

/* ================= surfaces ================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:450}
.card-h .sp{flex:1}
.page-h{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.page-h h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.page-h p{font-size:13px;color:var(--muted);margin-top:3px;max-width:70ch}
.page-h .sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12px}
.xsmall{font-size:11px}
.b6{font-weight:600}.b7{font-weight:700}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 14px;text-align:center;color:var(--muted);font-size:13px}
.empty svg{width:26px;height:26px;opacity:.5}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi .k-h{display:flex;align-items:center;gap:8px}
.kpi .k-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--jade-soft);color:var(--jade);flex:none}
.kpi .k-ic.amber{background:var(--amber-soft);color:var(--amber)}
.kpi .k-ic.clay{background:var(--clay-soft);color:var(--clay)}
.kpi .k-ic.slate{background:var(--slate-soft);color:var(--slate)}
.kpi .k-l{font-size:12.5px;color:var(--muted);font-weight:550}
.kpi .k-v{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.kpi .k-v small{font-size:14px;font-weight:600;color:var(--faint);letter-spacing:0}
.kpi .k-s{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.kpi .k-s .up{color:var(--jade);font-weight:650}
.kpi .k-s .down{color:var(--clay);font-weight:650}

/* chips / badges */
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;
  padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);
  border:1px solid transparent;white-space:nowrap;letter-spacing:.005em
}
.chip.jade{background:var(--jade-soft);color:var(--jade);border-color:var(--jade-line)}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.chip.clay{background:var(--clay-soft);color:var(--clay);border-color:var(--clay-line)}
.chip.slate{background:var(--slate-soft);color:var(--slate);border-color:var(--slate-line)}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;display:inline-block}
.dot.on{background:var(--jade)}
.dot.off{background:var(--faint)}
.dot.warn{background:var(--amber)}
.dot.demo{background:var(--slate)}
.dot.pulse{box-shadow:0 0 0 0 var(--jade-line);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(14,124,102,0)}100%{box-shadow:0 0 0 0 rgba(14,124,102,0)}}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{
  text-align:start;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)
}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl td.r,table.tbl th.r{text-align:end}
.cellname{display:flex;align-items:center;gap:10px;min-width:0}
.cellname .ico{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;color:var(--jade);flex:none;font-weight:700;font-size:12.5px}
.cellname b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cellname span{font-size:11.5px;color:var(--muted)}

/* progress / rings / meters */
.meter{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;min-width:60px}
.meter>i{display:block;height:100%;border-radius:99px;background:var(--jade);transition:width .6s cubic-bezier(.4,0,.2,1)}
.meter>i.amber{background:var(--amber)}
.meter>i.clay{background:var(--clay)}
.meter>i.slate{background:var(--slate)}
.ring{--p:0;--c:var(--jade);width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--ring-track) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;z-index:1;font-size:15px;font-weight:700;letter-spacing:-.02em}
.ring.lg{width:84px;height:84px}
.ring.lg::after{inset:9px}
.ring.lg b{font-size:21px}

/* activity feed */
.feed{display:flex;flex-direction:column;gap:7px;max-height:360px;overflow:auto;padding-inline-end:2px}
.ev{font-size:12.5px;padding:9px 11px;border-radius:9px;background:var(--surface-2);border-inline-start:3px solid var(--line);line-height:1.4}
.ev.staff{border-color:var(--amber)}
.ev.manager{border-color:var(--clay);background:var(--clay-soft)}
.ev.ok{border-color:var(--jade)}
.ev b{font-weight:600}

/* staff list */
.staff{display:flex;flex-direction:column;gap:12px}
.st{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);display:grid;place-items:center;font-weight:700;font-size:12.5px;position:relative;flex:none}
.av.top{background:var(--jade);color:#fff}
.av::after{content:"";position:absolute;inset-inline-end:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);background:var(--faint)}
.av.ready::after{background:var(--jade)}
.av.active::after{background:var(--amber)}
.st .row1{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13.5px}
.st .row1 span{color:var(--muted);font-weight:600;font-size:12.5px}
.st .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.eff{height:6px;background:var(--surface-3);border-radius:99px;margin-top:6px;overflow:hidden}
.eff>i{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .7s}

/* ranking */
.rank{display:flex;flex-direction:column;gap:11px}
.rank a{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 6px;margin:-5px -6px;border-radius:9px}
.rank a:hover{background:var(--surface-2)}
.rank .no{font-size:13px;font-weight:700;color:var(--faint);text-align:center}
.rank .no.first{color:var(--jade)}
.rank .bar2{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:5px}
.rank .bar2>i{display:block;height:100%;border-radius:99px;background:var(--jade);transition:width .7s}
.rank .sc{font-size:13.5px;font-weight:700}

/* restaurant cards */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rc{
  display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s,border-color .16s;text-align:start
}
.rc:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--jade-line)}
.rc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rn{font-size:16px;font-weight:650;letter-spacing:-.01em}
.rs{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:18px;height:18px;border-radius:5px;background:var(--surface-3);display:block}
.dots i.occupied,.dots i.waiting.ok{background:var(--jade)}
.dots i.waiting.warn{background:var(--amber)}
.dots i.waiting.critical,.dots i.dirty.critical{background:var(--clay)}
.dots i.dirty{background:var(--slate)}
.rc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px dashed var(--line);padding-top:11px}
.rc-stats b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.rc-stats span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.rc-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* room / tables */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.t{border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;overflow:hidden;background:var(--surface)}
.t::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--surface-3)}
html[dir=rtl] .t::before{inset:0 0 0 auto}
.t.occupied::before,.t.waiting.ok::before{background:var(--jade)}
.t.waiting.warn::before{background:var(--amber)}
.t.waiting.critical::before,.t.dirty.critical::before{background:var(--clay)}
.t.dirty::before{background:var(--slate)}
.t.critical{border-color:var(--clay-line)}
.t .n{font-weight:600;padding-inline-end:66px;font-size:13.5px}
.t .s{font-size:11px;color:var(--muted);margin-top:2px;min-height:14px}
.t .time{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:6px 0 5px;font-variant-numeric:tabular-nums}
.badge{position:absolute;top:10px;inset-inline-end:10px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.badge.waiting{background:var(--amber-soft);color:var(--amber)}
.badge.dirty{background:var(--slate-soft);color:var(--slate)}
.badge.occupied{background:var(--jade-soft);color:var(--jade)}
.plan{width:100%;max-height:290px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:block}
.live img{width:100%;border-radius:10px;display:block}

/* AI chat */
.msgs{display:flex;flex-direction:column;gap:9px;max-height:360px;overflow:auto;padding:2px;margin-bottom:12px}
.msg{padding:10px 13px;border-radius:14px;max-width:92%;font-size:13.5px;line-height:1.55;word-wrap:break-word}
.msg.u{background:var(--jade);color:#fff;align-self:flex-end;border-end-end-radius:4px}
.msg.a{background:var(--surface-2);border:1px solid var(--line);align-self:flex-start;border-end-start-radius:4px}
.msg.err{background:var(--clay-soft);border-color:var(--clay-line);color:var(--clay);align-self:flex-start}
.msg.typing{color:var(--muted);font-style:italic}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:12.5px;color:var(--ink-2);min-height:34px;transition:background .15s,border-color .15s}
.chipbtn:hover{background:var(--surface-2);border-color:var(--jade-line);color:var(--jade)}
.chipbtn:disabled{opacity:.45;pointer-events:none}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 13px;min-height:42px;font-size:14px;background:var(--surface)}
.ask input:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-soft)}
.hint{font-size:12.5px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:10px;padding:10px 12px}
.hint.jade{color:var(--jade);background:var(--jade-soft);border-color:var(--jade-line)}

/* alerts / banners */
.banner{
  display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-radius:12px;
  background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber);font-size:13px;line-height:1.5
}
.banner.clay{background:var(--clay-soft);border-color:var(--clay-line);color:var(--clay)}
.banner.jade{background:var(--jade-soft);border-color:var(--jade-line);color:var(--jade)}
.banner b{font-weight:700}
.banner .sp{flex:1}
.banner .btn{align-self:center}

/* tabs (detail page) */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s
}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--jade);border-bottom-color:var(--jade)}

/* timeline / date strip */
.strip{display:flex;gap:3px;flex-wrap:wrap}
.strip i{width:14px;height:26px;border-radius:4px;background:var(--surface-3);display:block}
.strip i.on{background:var(--jade)}
.strip i.off{background:var(--clay-soft);border:1px solid var(--clay-line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}

/* charts (pure CSS/SVG) */
.chart{width:100%;height:180px;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--jade);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chart .ar{fill:var(--jade-soft);stroke:none}
.chart .pt{fill:var(--jade);stroke:var(--surface);stroke-width:2}
.chart text{fill:var(--faint);font-size:9.5px;font-family:inherit}
.hbars{display:flex;flex-direction:column;gap:11px}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.hbar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
.hbar .val{font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px}
.donut{--p:0;--c:var(--jade);width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--ring-track) 0);display:grid;place-items:center;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--surface)}
.donut b{position:relative;z-index:1;font-size:19px;font-weight:700;letter-spacing:-.02em;text-align:center;line-height:1.1}
.donut b small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* permission matrix */
.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:9px}
.perm{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;transition:border-color .15s,background .15s;text-align:start;width:100%}
.perm:hover{border-color:var(--jade-line)}
.perm.on{background:var(--jade-soft);border-color:var(--jade-line);color:var(--jade);font-weight:600}
.perm .box{width:17px;height:17px;border-radius:5px;border:1.6px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.perm.on .box{background:var(--jade);border-color:var(--jade);color:#fff}
.perm .box svg{width:11px;height:11px;stroke-width:3;opacity:0}
.perm.on .box svg{opacity:1}
.perm span{min-width:0}

/* login */
.login{max-width:380px;margin:7vh auto;display:flex;flex-direction:column;gap:13px;align-items:center;text-align:center}
.login .mark.lg{box-shadow:var(--shadow)}
.login h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
.login p{font-size:13px;color:var(--muted);margin-top:-6px}
.login .box{width:100%;display:flex;flex-direction:column;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.login input{text-align:center;min-height:46px;font-size:15px;letter-spacing:.16em}
.login .err{color:var(--clay);font-size:12.5px;min-height:16px}

/* dialog + toast */
dialog{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;
  padding:0;max-width:520px;width:94%;box-shadow:var(--shadow-lg);max-height:88vh;overflow:auto
}
dialog::backdrop{background:rgba(8,16,14,.55);backdrop-filter:blur(3px)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dlg-h h3{font-size:15.5px;font-weight:650;letter-spacing:-.01em;flex:1}
.dlg-b{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg-f{display:flex;gap:9px;justify-content:flex-end;padding:15px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
dialog pre{white-space:pre-wrap;font:inherit;font-size:13px;line-height:1.7;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:46vh;overflow:auto}
#toast{
  position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:11px;font-size:13.5px;font-weight:550;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.24s;z-index:200;max-width:88vw;text-align:center
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* skeleton */
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}

/* mobile shell */
.scrim{position:fixed;inset:0;background:rgba(8,16,14,.5);opacity:0;pointer-events:none;transition:opacity .22s;z-index:55}
.scrim.on{opacity:1;pointer-events:auto}
.burger{display:none}
.mobnav{display:none}

@media(max-width:1023px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{
    position:fixed;inset-block:0;inset-inline-start:0;width:var(--side-w);
    transform:translateX(-102%);transition:transform .24s cubic-bezier(.4,0,.2,1);box-shadow:none
  }
  html[dir=rtl] .side{transform:translateX(102%)}
  .side.on{transform:none;box-shadow:var(--shadow-lg)}
  .burger{display:inline-grid}
  .top-in{padding:8px 14px}
  .view{padding:16px 14px calc(28px + env(safe-area-inset-bottom));gap:15px}
  .split,.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .g4.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rgrid{grid-template-columns:minmax(0,1fr)}
  .mobnav{
    display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;inset-inline:0;z-index:50;
    background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))
  }
  .mobnav button{
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:650;
    color:var(--muted);min-height:50px;border-radius:10px;justify-content:center;position:relative
  }
  .mobnav button.on{color:var(--jade)}
  .mobnav .badge-n{
    position:absolute;top:4px;inset-inline-end:calc(50% - 20px);min-width:15px;height:15px;padding:0 4px;
    border-radius:99px;background:var(--clay);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center
  }
  .view{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .card{padding:15px}
  .page-h h2{font-size:18px}
  .search{max-width:none}
  /* stacked tables on phones */
  table.tbl.stackable thead{display:none}
  table.tbl.stackable,table.tbl.stackable tbody,table.tbl.stackable tr,table.tbl.stackable td{display:block;width:100%}
  table.tbl.stackable tr{border-bottom:1px solid var(--line);padding:6px 4px}
  table.tbl.stackable tr:last-child{border-bottom:0}
  table.tbl.stackable td{
    border:0;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:end
  }
  table.tbl.stackable td::before{
    content:attr(data-l);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--faint);text-align:start;flex:none
  }
  table.tbl.stackable td:empty{display:none}
  table.tbl.stackable td.full{display:block;text-align:start}
  table.tbl.stackable td.full::before{display:block;margin-bottom:5px}
  .hbar{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .hbar .lbl{grid-column:1/-1}
  .hide-sm{display:none!important}
}
@media(max-width:560px){
  .g4.kpis{grid-template-columns:minmax(0,1fr)}
  .top-in{gap:7px}
  .crumb b{font-size:14.5px}
  .crumb span{display:none}
  .kpi .k-v{font-size:23px}
  .btn{padding:0 12px}
  .view{padding-inline:12px}
  .card-h{gap:8px}
  .tables{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .t .time{font-size:22px}
}
@media print{.side,.top,.mobnav{display:none}.app{grid-template-columns:1fr}.view{padding:0}}
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="side">
    <div class="side-head">
      <img class="mark" src="/static/emblem.png" alt="Nardjis">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="who">
        <div class="av">AD</div>
        <div class="tx"><b id="whoName">Admin</b><span id="whoRole">Owner</span></div>
      </div>
      <button class="ibtn bare" id="logoutBtn" style="width:100%;justify-content:flex-start;display:flex;gap:9px;padding:0 9px;height:36px;font-size:13px;color:var(--muted)">
        <svg class="i sm" viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></svg>
        <span data-i18n="logout">Logout</span>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="top">
      <div class="top-in">
        <button class="ibtn burger" id="burger" aria-label="Menu">
          <svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="crumb"><b id="crumbT">Overview</b><span id="crumbS"></span></div>
        <div class="sp"></div>
        <select class="inp hide-sm" id="sw" style="width:auto;max-width:210px" hidden></select>

        <div class="menu-wrap">
          <button class="ibtn" id="globeBtn" aria-label="Language" title="Language">
            <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
          </button>
          <div class="menu" id="globeMenu" hidden></div>
        </div>

        <button class="ibtn" id="themeBtn" aria-label="Theme" title="Theme">
          <svg class="i" id="themeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>

        <div class="menu-wrap hide-sm">
          <button class="ibtn" id="userBtn" aria-label="Account">
            <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c.6-3.7 3.7-5.6 7.5-5.6s6.9 1.9 7.5 5.6"/></svg>
          </button>
          <div class="menu" id="userMenu" hidden>
            <div class="menu-h" id="userMenuH">Signed in</div>
            <button id="miTheme"><svg class="i sm" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg><span data-i18n="toggle_theme">Switch theme</span></button>
            <button id="miLang"><svg class="i sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21"/></svg><span data-i18n="language">Language</span></button>
            <hr>
            <button class="danger" id="miOut"><svg class="i sm" viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></svg><span data-i18n="logout">Logout</span></button>
          </div>
        </div>
      </div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<nav class="mobnav" id="mobnav"></nav>

<dialog id="dlg">
  <div class="dlg-h"><h3 id="dlgT"></h3>
    <button class="ibtn bare" id="dlgX" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="dlg-b" id="dlgB"></div>
  <div class="dlg-f" id="dlgF"></div>
</dialog>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   Icons — inline SVG (stroke = currentColor)
   ============================================================ */
const ICON = {
  overview:'<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 8h6V4h-6z"/>',
  restaurants:'<path d="M4 9l1.2-4.2A1.5 1.5 0 0 1 6.7 3.7h10.6a1.5 1.5 0 0 1 1.5 1.1L20 9M4 9h16M4 9v10a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 19V9M4 9a2.5 2.5 0 0 0 4 0 2.5 2.5 0 0 0 4 0 2.5 2.5 0 0 0 4 0 2.5 2.5 0 0 0 4 0M9.5 14.5h5"/>',
  reports:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4"/>',
  analytics:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  health:'<path d="M20.8 8.6a5.5 5.5 0 0 0-9.3-3 5.5 5.5 0 0 0-9.3 3c0 5 9.3 11.4 9.3 11.4s9.3-6.4 9.3-11.4z"/>',
  team:'<circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9.5" r="2.4"/><path d="M3 19.5c.5-3.3 3-5.1 6-5.1s5.5 1.8 6 5.1M15.5 14.6c2.7-.3 4.9 1.3 5.5 4.4"/>',
  ai:'<path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4zM18.5 16l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>',
  admin:'<circle cx="12" cy="12" r="3.1"/><path d="M19.4 14.6a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  check:'<path d="M4.5 12.5l5 5 10-11"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  chev:'<path d="M6 9l6 6 6-6"/>',
  right:'<path d="M9 6l6 6-6 6"/>',
  left:'<path d="M15 6l-6 6 6 6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.3 2"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',

const todayISO = (d=new Date()) => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate()+n); return todayISO(d); };
const daysBetween = (a, b) => Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00")) / DAY);
const fmtDate = iso => { if(!iso) return "–"; const d = new Date(iso + (iso.length===10 ? "T00:00:00" : ""));
  try { return new Intl.DateTimeFormat(L==="ar"?"ar-DZ":L==="fr"?"fr-FR":"en-GB",{day:"2-digit",month:"short",year:"numeric"}).format(d); }

  catch(e){ return (n||0) + " " + c; } };

/* deterministic pseudo-random from a string (stable demo data) */
function seedOf(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t>>>15), t | 1); t ^= t + Math.imul(t ^ (t>>>7), t | 61); return ((t ^ (t>>>14)) >>> 0) / 4294967296; }; }

/* --- derived per-restaurant admin data (seeded, then editable) --- */
function subOf(r){
  if (ST.subs[r.id]) return ST.subs[r.id];
  const rand = rng(seedOf("sub:" + r.id));
  const plan = rand() < 0.55 ? "monthly" : "yearly";
  const monthsBack = Math.floor(rand()*14) + 1;
  let start = new Date(Date.now() - monthsBack*30*DAY - Math.floor(rand()*20)*DAY);
  const dur = plan === "yearly" ? 365 : 30;
  // roll forward so the current period is the last one
  let end = new Date(start.getTime() + dur*DAY);
  while (end.getTime() < Date.now() + DAY) { start = new Date(start.getTime() + dur*DAY); end = new Date(start.getTime() + dur*DAY); }
  const s = {
    plan, price: plan === "yearly" ? ST.settings.yearly : ST.settings.monthly,
    start: todayISO(start), end: todayISO(end),
    auto: rand() > 0.2, status: "active",
  };
  const left = daysBetween(todayISO(), s.end);
  if (left < 0) s.status = "expired";
  ST.subs[r.id] = s;
  return s;
}
function subStatus(s){
  const left = daysBetween(todayISO(), s.end);
  if (left < 0) return "expired";
  if (left <= (ST.settings.warnDays||14)) return "expiring";
  if (s.status === "trial") return "trial";
  return "active";
}
function usageOf(r){
  if (ST.usage[r.id]) return ST.usage[r.id];
  const rand = rng(seedOf("use:" + r.id));
  const on = [], off = [];
  for (let i=29;i>=0;i--){
    const d = addDays(todayISO(), -i);
    const p = rand();
    const isOn = i === 0 ? !!r.online : p > 0.13;
    (isOn ? on : off).push(d);
    if (i === 0 && !r.online) off.push(d);
  }
  const uniqOff = [...new Set(off)];
  const uniqOn = [...new Set(on)].filter(d => !uniqOff.includes(d));
  const u = {
    req: Math.floor(rand()*(ST.settings.quota||500)*0.8) + 5,
    tokens: 0, on: uniqOn, off: uniqOff,
    served: 0, abandoned: 0, visits: 0,
  };
  u.tokens = u.req * (600 + Math.floor(rand()*900));
  ST.usage[r.id] = u;
  return u;
}
function syncLiveUsage(r){
  const u = usageOf(r);
  if (r.kpi){ u.served = r.kpi.served||0; u.abandoned = r.kpi.abandoned||0; }
  if (r.staff) u.visits = r.staff.reduce((a,s)=>a+(s.visits||0),0);
  const t = todayISO();
  if (r.online){ if (!u.on.includes(t)) u.on.push(t); u.off = u.off.filter(d=>d!==t); }
  else { if (!u.off.includes(t)) u.off.push(t); u.on = u.on.filter(d=>d!==t); }
  return u;
}

function lineChart(values, labels){
  const w = 300, h = 100, pad = 4;
  if (!values.length) return `<div class="empty">${esc(t("nothing_here"))}</div>`;
  const max = Math.max(...values, 1), min = 0;
  const x = i => pad + i * ((w - pad*2) / Math.max(1, values.length - 1));
  const y = v => h - pad - ((v - min) / (max - min || 1)) * (h - pad*2);
  const pts = values.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const area = `M${x(0).toFixed(1)},${h-pad} L` + pts.join(" L") + ` L${x(values.length-1).toFixed(1)},${h-pad} Z`;
  const last = values.length - 1;
  const ticks = labels && labels.length ? labels.map((lb,i) =>
    (i === 0 || i === values.length-1 || i === Math.floor(values.length/2)) ?
    `<text x="${clamp(x(i),10,w-10)}" y="${h+1}" text-anchor="middle">${esc(lb)}</text>` : "").join("") : "";
  return `<svg class="chart" viewBox="0 0 ${w} ${h+10}" preserveAspectRatio="none" role="img">
    <line class="gl" x1="0" y1="${h-pad}" x2="${w}" y2="${h-pad}"/>
    <path class="ar" d="${area}"/>
    <polyline class="ln" points="${pts.join(" ")}"/>
    <circle class="pt" cx="${x(last)}" cy="${y(values[last])}" r="3.4"/>
    ${ticks}
  </svg>`;
}

function collectFeed(){
  const out = [];
  O.restaurants.forEach(r => {
    const st = STATES[r.id];
    if (!st || !st.events) return;
    [...st.events].reverse().slice(0, 4).forEach(e => {
      const txt = evText(e); if (!txt) return;
      out.push({cls: e.notify || ((e.type==="served"||e.type==="cleaned") ? "ok" : ""), html:`<b>${esc(r.name)}</b> — ${txt}`, ts:e.ts||0});
    });
  });
  return out.slice(0, 8);
}

function paintRoom(r){
  if (!r) return;
  const st = STATES[r.id]; if (!st || tab !== "room" || route.v !== "rest") return;
  const T2 = T(), m = st.meta || {};
  const tbl = $("tables"); if (!tbl) return;
  tbl.innerHTML = st.tables.map(x => {
    const sec = x.state==="waiting" ? x.wait : x.state==="dirty" ? x.dirty : x.state==="occupied" ? x.seated : 0;
    const p = x.state==="waiting" ? Math.min(x.patience,1)*100 : x.state==="dirty" ? Math.min(x.dirty/(2*(m.dirty_after||120)),1)*100 : 0;
    const tone = x.state==="free" ? "var(--faint)" : stateCol(x.state);
    const lbl = x.state==="free" ? t("free_l") : x.state==="occupied" ? t("occupied_l") : x.state==="waiting" ? t("waiting_l") : t("dirty_l");
    return `<div class="t ${x.state} ${x.level}"><span class="badge ${x.state}">${esc(lbl)}</span>
      <div class="n">${esc(x.name)}</div>
      <div class="s">${x.clients ? x.clients + " " + esc(t("clients")) : ""}</div>
      <div class="time" style="color:${tone}">${x.state==="free"?"—":mm(sec)}</div>
      <div class="meter"><i class="${x.level==="critical"?"clay":x.level==="warn"?"amber":""}" style="width:${p}%"></i></div></div>`;
  }).join("");
  let svg = "";
  st.tables.forEach(x => {
    const pts = x.polygon.map(p => (p[0]*100)+","+(p[1]*62)).join(" ");
    const c = stateCol(x.state);
    svg += `<polygon points="${pts}" fill="${c}" fill-opacity="${x.state==="free"?.14:.24}" stroke="${c}" stroke-width=".5"/>
      <text x="${x.center[0]*100}" y="${x.center[1]*62}" font-size="2.4" text-anchor="middle" dominant-baseline="middle" fill="currentColor" font-weight="600">${esc(x.name)}</text>`;
  });
  (st.staff||[]).forEach((s,i) => { if (!s.pos || s.status === "away") return;
    svg += `<g style="transform:translate(${s.pos[0]*100}px,${s.pos[1]*62}px);transition:transform .6s linear">
      <circle r="2.6" fill="${i===0&&s.effort>0?"var(--jade)":"var(--ink)"}" stroke="var(--surface)" stroke-width=".5"/>
      <text y=".1" font-size="2.6" fill="var(--surface)" text-anchor="middle" dominant-baseline="middle" font-weight="600">${esc(s.name[0])}</text></g>`; });
  const pl = $("plan"); if (pl) pl.innerHTML = svg;

  const mx = Math.max(1, ...(st.staff||[]).map(s => s.effort));
  const sf = $("staff");
  if (sf) sf.innerHTML = (st.staff||[]).length ? st.staff.map((s,i) => `
    <div class="st"><div class="av ${s.status} ${i===0&&s.effort>0?"top":""}">${esc(s.name[0])}</div>
      <div><div class="row1"><span>${esc(s.name)}${i===0&&s.effort>0?" ★":""}</span><span>${Math.round(100*s.effort/mx)}</span></div>
      <div class="eff"><i style="width:${100*s.effort/mx}%"></i></div>
      <div class="meta">${esc(t(s.status==="ready"?"ready":s.status==="active"?"active_s":"away"))} · ${s.visits} ${esc(t("visits"))} · ${s.tasks_done} ${esc(t("done_s"))} · ${s.distance_m} m${s.avg_response!=null?" · "+esc(t("resp"))+" "+mm(s.avg_response):""}</div></div></div>`).join("")
    : emptyBox(t("none_l"));
  const w = [...(st.waits||[])].sort((a,b) => b.seconds - a.seconds).slice(0,6);
  const wl = $("waits");
  if (wl) wl.innerHTML = w.length ? `<div class="rank">${w.map(x => `
    <div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;padding-bottom:7px;border-bottom:1px dashed var(--line)">
      <span>${esc(x.table)} · <span class="muted">${esc(x.kind==="abandoned"?t("abandoned"):(x.staff||t("served_l")))}</span></span>
      <b class="num">${mm(x.seconds)}</b></div>`).join("")}</div>` : emptyBox(t("none_l"));
  const f = [...(st.events||[])].reverse().map(e => ({e, x:evText(e)})).filter(z => z.x).slice(0,14);
  const fl = $("feed");
  if (fl) fl.innerHTML = f.length ? f.map(({e,x}) => `<div class="ev ${e.notify || ((e.type==="served"||e.type==="cleaned")?"ok":"")}">${x}</div>`).join("") : emptyBox(t("none_l"));
  if (m.mode === "live") { const im = $("live");
    if (im && !im.src) { im.onerror = () => { const c = im.closest(".card"); if (c) c.hidden = true; }; im.src = A("live", {id:r.id, t:Date.now()}); } }
}

  const used = clamp(total - left, 0, total);
  const hist = [];
  const dur = s.plan === "yearly" ? 365 : 30;
  for (let i = 4; i >= 1; i--) hist.push({d: addDays(s.end, -dur*i), p: s.price});
  return `
    <div class="split">
      <div class="stack">
        <div class="card">
          <div class="card-h"><h3>${ico("card")} ${esc(t("sub_title"))}</h3><div class="sp"></div>${chipFor(st)}</div>
          <div class="row" style="gap:24px;align-items:flex-start">
            <div class="ring lg" style="--p:${used/total*100};--c:${st==="expired"?"var(--clay)":st==="expiring"?"var(--amber)":"var(--jade)"}">
              <b>${left>=0?left:"–"}<small style="display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.05em">${esc(t("days"))}</small></b></div>
            <div style="flex:1;min-width:200px;display:grid;gap:11px">
              <div class="row" style="justify-content:space-between"><span class="muted small">${esc(t("plan"))}</span>
                <span class="chip ${s.plan==="yearly"?"slate":"jade"}">${esc(t(s.plan))} · ${esc(money(s.price))}</span></div>
              <div class="row" style="justify-content:space-between"><span class="muted small">${esc(t("sub_starts"))}</span><b class="num small">${esc(fmtDate(s.start))}</b></div>
              <div class="row" style="justify-content:space-between"><span class="muted small">${esc(t("sub_ends"))}</span>
                <b class="num small" style="color:${st==="expiring"?"var(--amber)":st==="expired"?"var(--clay)":"inherit"}">${esc(fmtDate(s.end))}</b></div>
              <div class="row" style="justify-content:space-between"><span class="muted small">${esc(t("sub_renews"))}</span>
                <span class="chip ${s.auto?"jade":""}">${esc(s.auto?t("auto"):t("no"))}</span></div>
              <div class="meter" style="margin-top:4px"><i class="${st==="expired"?"clay":st==="expiring"?"amber":""}" style="width:${used/total*100}%"></i></div>
              <div class="xsmall muted">${esc(t("sub_next"))} : ${esc(fmtDate(addDays(s.end, dur)))}</div>
            </div>
          </div>
          <div class="row" style="margin-top:16px">
            <button class="btn" id="subExtend">${ico("refresh","sm")} ${esc(t("sub_extend"))}</button>
            <button class="btn ghost" id="subSwitch">${ico("trend","sm")} ${esc(t("sub_change"))}</button>
            <button class="btn ghost" id="subInv">${ico("reports","sm")} ${esc(t("sub_invoice"))}</button>
            <div class="sp" style="flex:1"></div>
            <button class="btn danger" id="subCancel">${ico("trash","sm")} ${esc(t("sub_cancel"))}</button>
          </div>
        </div>

        <div class="card">
          <div class="card-h"><h3>${ico("calendar")} ${esc(t("sub_history"))}</h3></div>
          <div class="tbl-wrap"><table class="tbl stackable"><thead><tr>
            <th>${esc(t("rp_col_end"))}</th><th>${esc(t("plan"))}</th><th class="r">${esc(t("price"))}</th><th class="r">${esc(t("status"))}</th>
          </tr></thead><tbody>
            ${hist.map(h => `<tr><td data-l="${esc(t("rp_col_end"))}">${esc(fmtDate(h.d))}</td>
              <td data-l="${esc(t("plan"))}">${esc(t(s.plan))}</td>

              <td class="r" data-l="${esc(t("status"))}"><span class="chip jade">${esc(t("active"))}</span></td></tr>`).join("")}
          </tbody></table></div>
        </div>
      </div>

      <div class="stack">
        <div class="card">
          <div class="card-h"><h3>${ico("info")} ${esc(t("rs_col_plan"))}</h3></div>
          <div style="display:grid;gap:10px" class="small">
            <div class="row" style="justify-content:space-between"><span class="muted">${esc(t("rp_col_price"))}</span><b>${esc(money(s.price))} / ${esc(t(s.plan==="yearly"?"yearly":"monthly"))}</b></div>
            <div class="row" style="justify-content:space-between"><span class="muted">${esc(t("an_mrr"))}</span><b>${esc(money(s.plan==="yearly"?s.price/12:s.price))}</b></div>

/* ---- usage & uptime ---- */
function dtUsage(r){
  const u = syncLiveUsage(r);
  const quota = ST.settings.quota || 500;
  const usedPct = clamp(u.req / quota * 100, 0, 100);
  const onN = u.on.length, offN = u.off.length, tot = Math.max(1, onN + offN);
  const strip = [];
  for (let i = 29; i >= 0; i--){
    const d = addDays(todayISO(), -i);
    strip.push(`<i class="${u.on.includes(d)?"on":u.off.includes(d)?"off":""}" title="${d}"></i>`);
  }
  const q = r.kpi || {};
  return `
    <div class="grid g4 kpis">
      ${kpi({ic:"ai", label:t("usage_req"), value:`${u.req}<small>/${quota}</small>`, sub:`${esc(t("usage_left"))} : ${Math.max(0,quota-u.req)}<span class="meter" style="width:100%;margin-top:7px"><i class="${usedPct>85?"amber":""}" style="width:${usedPct}%"></i></span>`})}
      ${kpi({ic:"db", tone:"slate", label:t("usage_tokens"), value:(u.tokens/1000).toFixed(1)+"k", sub:`~${Math.round(u.tokens/Math.max(1,u.req))} / ${esc(t("usage_req"))}`})}
      ${kpi({ic:"clock", tone:"amber", label:t("usage_uptime"), value:pct(onN/tot*100), sub:`${onN} ${esc(t("days_on_label"))} · ${offN} ${esc(t("days_off_label"))}`})}
      ${kpi({ic:"team", label:t("usage_served"), value:q.served??0, sub:`${esc(t("usage_abandoned"))} : ${q.abandoned??0}`})}
    </div>
    <div class="split">
      <div class="stack">
        <div class="card">
          <div class="card-h"><h3>${ico("calendar")} ${esc(t("usage_strip"))}</h3><div class="sp"></div>
            <span class="sub">${esc(t("usage_uptime"))} : ${pct(onN/tot*100)}</span></div>
          <div class="strip">${strip.join("")}</div>
          <div class="legend" style="margin-top:12px">
            <span><i style="background:var(--jade)"></i>${esc(t("days_on_label"))} — ${onN}</span>
            <span><i style="background:var(--clay-soft);border:1px solid var(--clay-line)"></i>${esc(t("days_off_label"))} — ${offN}</span>
            <span><i style="background:var(--surface-3)"></i>–</span>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>${ico("ai")} ${esc(t("usage_ai"))}</h3></div>
          <div class="stack" style="gap:13px">
            ${hbar(esc(t("usage_req")), u.req, quota, `${u.req} / ${quota}`, usedPct>85?"amber":"")}
            ${hbar(esc(t("usage_tokens")), u.tokens, quota*1500, (u.tokens/1000).toFixed(1)+"k", "slate")}
            ${hbar(esc(t("usage_visits")), u.visits, Math.max(1,u.visits), String(u.visits), "")}
            ${hbar(esc(t("usage_served")), u.served, Math.max(1,u.served), String(u.served), "")}
          </div>
        </div>
      </div>
      <div class="stack">
        <div class="card">
          <div class="card-h"><h3>${ico("zap")} ${esc(t("summary"))}</h3></div>
          <div style="display:grid;gap:11px">
            <div class="row" style="justify-content:space-between"><span class="muted small">${esc(t("usage_served"))}</span><b class="num">${q.served??0}</b></div>
            <div class="row" style="justify-content:space-between"><span class="muted small">${esc(t("usage_abandoned"))}</span><b class="num" style="color:${(q.abandoned??0)>0?"var(--clay)":"inherit"}">${q.abandoned??0}</b></div>
            <div class="row" style="justify-content:space-between"><span class="muted small">${esc(t("usage_alerts_n"))}</span><b class="num">${q.alerts??0}</b></div>
            <div class="row" style="justify-content:space-between"><span class="muted small">${esc(t("usage_visits"))}</span><b class="num">${u.visits}</b></div>
            <div class="row" style="justify-content:space-between"><span class="muted small">${esc(t("k_avg_wait"))}</span><b class="num">${q.avg_wait!=null?mm(q.avg_wait):"–"}</b></div>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>${ico("clock")} ${esc(t("usage_off"))}</h3></div>
          ${offN ? `<div class="feed">${u.off.slice(-8).reverse().map(d => `<div class="ev">${esc(fmtDate(d))} — <b>${esc(t("offline"))}</b></div>`).join("")}</div>`
            : emptyBox(t("usage_uptime"), "wifi")}
        </div>
      </div>
    </div>`;
}

/* ============================================================
   View: REPORTS (subscriptions + expiry alerts)

let rpPlan = "all", rpSort = "end";

  const warn = ST.settings.warnDays || 14;
  const rows = O.restaurants.map(r => { const s = subOf(r); return {r, s, st: subStatus(s), left: daysBetween(todayISO(), s.end)}; });
  const expiring = rows.filter(x => x.left >= 0 && x.left <= warn).sort((a,b) => a.left - b.left);
  const expired = rows.filter(x => x.left < 0);
  const activeN = rows.length - expired.length;
  const revenue = rows.filter(x => x.left >= 0).reduce((a,x) => a + (x.s.plan==="yearly" ? x.s.price/12 : x.s.price), 0);

  let list = rows.filter(x => rpPlan === "all" || x.s.plan === rpPlan);
  list.sort((a,b) => rpSort === "end" ? a.left - b.left : rpSort === "name" ? a.r.name.localeCompare(b.r.name) : b.left - a.left);

  $("view").innerHTML = `
    <div class="page-h">
      <div><h2>${esc(t("rp_title"))}</h2><p>${esc(t("rp_sub"))}</p></div>
      <div class="sp"></div>
      <button class="btn ghost" id="rpCsv">${ico("download","sm")} ${esc(t("rp_export_csv"))}</button>

      ? `<div class="banner">${ico("alert")}<span class="sp"><b>${esc(t("rp_alert_b").replace("{n}", expiring.length).replace("{d}", warn))}</b>
          <br><span class="small">${esc(expiring.slice(0,4).map(x => x.r.name + " · " + x.left + " " + t("days")).join("  |  "))}</span></span></div>`
      : `<div class="banner jade">${ico("check")}<span>${esc(t("rp_alert_none").replace("{d}", warn))}</span></div>`}
    ${expired.length ? `<div class="banner clay">${ico("alert")}<span class="sp"><b>${expired.length} × ${esc(t("expired"))}</b>
      <br><span class="small">${esc(expired.map(x => x.r.name).join(" · "))}</span></span></div>` : ""}

    <div class="grid g4 kpis">
      ${kpi({ic:"card", label:t("rp_sum_active"), value:activeN, sub:`/ ${rows.length} ${esc(t("rs_count"))}`})}
      ${kpi({ic:"clock", tone:"amber", label:t("rp_sum_expiring").replace("{d}", warn), value:expiring.length, sub:esc(t("rp_close"))})}
      ${kpi({ic:"alert", tone:"clay", label:t("rp_sum_expired"), value:expired.length, sub:""})}
      ${kpi({ic:"trend", label:t("rp_sum_revenue"), value:esc(money(revenue)), sub:`${esc(t("an_mrr"))}`})}
    </div>

    <div class="card flush">
      <div style="padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)">
        <div class="seg" id="rpPlan">
          ${["all","monthly","yearly"].map(p => `<button data-p="${p}" class="${rpPlan===p?"on":""}">${esc(p==="all"?t("all"):t(p))}</button>`).join("")}
        </div>
        <div class="sp" style="flex:1"></div>
        <div class="seg" id="rpSort">
          ${[["end","rp_col_end"],["name","name"],["left","rp_col_left"]].map(([k,lb]) => `<button data-s="${k}" class="${rpSort===k?"on":""}">${esc(t(lb))}</button>`).join("")}
        </div>
      </div>
      <div class="tbl-wrap"><table class="tbl stackable">
        <thead><tr>
          <th>${esc(t("rp_col_rest"))}</th><th>${esc(t("rp_col_plan"))}</th>
          <th>${esc(t("rp_col_start"))}</th><th>${esc(t("rp_col_end"))}</th>
          <th class="r">${esc(t("rp_col_left"))}</th><th class="r">${esc(t("price"))}</th>

            <td data-l="${esc(t("rp_col_plan"))}"><span class="chip ${x.s.plan==="yearly"?"slate":"jade"}">${esc(t(x.s.plan))}</span></td>

function exportCsv(list){
  const head = ["restaurant","id","plan","start","end","days_left","price","status","ai_requests","days_on_30","days_off_30","health"];
  const lines = [head.join(",")];
  list.forEach(x => {
    const u = syncLiveUsage(x.r);
    lines.push([`"${x.r.name}"`, x.r.id, x.s.plan, x.s.start, x.s.end, x.left, x.s.price, x.st,
      u.req, u.on.length, u.off.length, x.r.health ?? ""].join(","));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `nardjis-subscriptions-${todayISO()}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  toast(t("rp_csv_saved"));
}

let anRange = 30;
function renderAnalytics(){
  const days = anRange;
  const labels = [], served = [], alerts = [], ai = [];
  for (let i = days-1; i >= 0; i--){
    const d = addDays(todayISO(), -i);
    labels.push(d.slice(8) + "/" + d.slice(5,7));
    const h = ST.history[d] || null;
    const rand = rng(seedOf("day:" + d));
    const base = O.restaurants.length * (28 + rand()*22);
    served.push(h ? h.served : Math.round(base * (0.75 + rand()*0.5)));
    alerts.push(h ? h.alerts : Math.round(base/9 * (0.5 + rand())));
    ai.push(h ? h.ai : Math.round(O.restaurants.length * (14 + rand()*26)));
  }
  const sum = a => a.reduce((x,y) => x+y, 0);
  const half = Math.floor(days/2);
  const prev = a => sum(a.slice(0, half)) || 1;
  const growth = (cur, prv) => Math.round((cur - prv) / prv * 100);

  const byRest = O.restaurants.map(r => ({r, v: (r.kpi ? r.kpi.served : 0)})).sort((a,b) => b.v - a.v);
  const maxServed = Math.max(1, ...byRest.map(x => x.v));
  const mix = {monthly:0, yearly:0};
  O.restaurants.forEach(r => mix[subOf(r).plan]++);
  const mrr = O.restaurants.reduce((a,r) => { const s = subOf(r); return subStatus(s)==="expired" ? a : a + (s.plan==="yearly" ? s.price/12 : s.price); }, 0);
  const churn = O.restaurants.filter(r => { const s = subOf(r); return daysBetween(todayISO(), s.end) <= (ST.settings.warnDays||14); }).length;
  const aiByRest = O.restaurants.map(r => ({r, v: usageOf(r).req})).sort((a,b) => b.v - a.v);
  const maxAi = Math.max(1, ...aiByRest.map(x => x.v));

  $("view").innerHTML = `
    <div class="page-h">
      <div><h2>${esc(t("an_title"))}</h2><p>${esc(t("an_sub"))}</p></div>
      <div class="sp"></div>
      <div class="seg" id="anRange">
        ${[7,30,90].map(d => `<button data-d="${d}" class="${anRange===d?"on":""}">${esc(t("an_"+d))}</button>`).join("")}
      </div>
    </div>

    <div class="grid g4 kpis">
      ${kpi({ic:"team", label:t("an_served"), value:sum(served).toLocaleString(),
        sub:`<span class="${growth(sum(served),prev(served))>=0?"up":"down"}">${growth(sum(served),prev(served))>=0?"▲":"▼"} ${Math.abs(growth(sum(served),prev(served)))}%</span> ${esc(t("an_vs_prev"))}`})}
      ${kpi({ic:"bell", tone:"amber", label:t("an_alerts_c"), value:sum(alerts).toLocaleString(),
        sub:`<span class="${growth(sum(alerts),prev(alerts))<=0?"up":"down"}">${growth(sum(alerts),prev(alerts))<=0?"▼":"▲"} ${Math.abs(growth(sum(alerts),prev(alerts)))}%</span> ${esc(t("an_vs_prev"))}`})}
      ${kpi({ic:"ai", tone:"slate", label:t("an_ai_c"), value:O.restaurants.reduce((a,r)=>a+usageOf(r).req,0).toLocaleString(),
        sub:`${esc(t("usage_quota"))} : ${(O.restaurants.length*(ST.settings.quota||500)).toLocaleString()}`})}
      ${kpi({ic:"trend", label:t("an_mrr"), value:esc(money(mrr)), sub:`${esc(t("an_churn"))} : ${churn}`})}
    </div>

    <div class="split">
      <div class="stack">
        <div class="card">
          <div class="card-h"><h3>${ico("analytics")} ${esc(t("an_served"))}</h3><div class="sp"></div>
            <span class="sub">${esc(t("an_range"))} : ${esc(t("an_"+days))}</span></div>
          ${lineChart(served, labels)}
          <div class="legend" style="margin-top:8px"><span><i style="background:var(--jade)"></i>${esc(t("an_served"))}</span></div>
        </div>
        <div class="card">
          <div class="card-h"><h3>${ico("bell")} ${esc(t("an_alerts_c"))}</h3></div>
          ${lineChart(alerts, labels)}
        </div>
        <div class="card">
          <div class="card-h"><h3>${ico("restaurants")} ${esc(t("an_by_rest"))}</h3></div>
          <div class="hbars">${byRest.map(x => hbar(`<a href="#/r/${x.r.id}">${esc(x.r.name)}</a>`, x.v, maxServed, String(x.v))).join("")}</div>
        </div>
      </div>
      <div class="stack">
        <div class="card">
          <div class="card-h"><h3>${ico("card")} ${esc(t("an_mix"))}</h3></div>
          <div class="row" style="gap:20px;justify-content:center">
            ${donut(O.restaurants.length ? mix.yearly/O.restaurants.length*100 : 0, mix.yearly, t("yearly"), "var(--slate)")}
            <div style="display:grid;gap:9px" class="small">
              <span class="row" style="gap:8px"><i style="width:11px;height:11px;border-radius:3px;background:var(--jade);display:block"></i>${esc(t("monthly"))} : <b>${mix.monthly}</b></span>
              <span class="row" style="gap:8px"><i style="width:11px;height:11px;border-radius:3px;background:var(--slate);display:block"></i>${esc(t("yearly"))} : <b>${mix.yearly}</b></span>
              <span class="row" style="gap:8px"><i style="width:11px;height:11px;border-radius:3px;background:var(--amber);display:block"></i>${esc(t("an_churn"))} : <b>${churn}</b></span>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>${ico("ai")} ${esc(t("an_top_ai"))}</h3></div>
          <div class="hbars">${aiByRest.map(x => hbar(esc(x.r.name), x.v, maxAi, String(x.v), x.v/maxAi>0.7?"amber":"")).join("")}</div>
        </div>
        <div class="card">
          <div class="card-h"><h3>${ico("wifi")} ${esc(t("an_uptime_t"))}</h3></div>
          <div class="hbars">${O.restaurants.map(r => { const u = usageOf(r);
            const p = u.on.length / Math.max(1, u.on.length + u.off.length) * 100;
            return hbar(esc(r.name), p, 100, pct(p), p<70?"amber":""); }).join("")}</div>
        </div>
      </div>
    </div>`;
  $("anRange").querySelectorAll("button").forEach(b => b.onclick = () => { anRange = +b.dataset.d; renderAnalytics(); });
}

function incRow(i){
  const sevTone = i.sev === "critical" ? "clay" : i.sev === "warning" ? "amber" : "slate";
  const stTone = i.status === "resolved" ? "jade" : i.status === "ack" ? "slate" : "clay";
  const r = (O && O.restaurants.find(x => x.id === i.rest)) || {name:i.rest};
  return `<div class="ev ${i.status==="resolved"?"ok":i.sev==="critical"?"manager":i.sev==="warning"?"staff":""}" style="border-inline-start-color:var(--${sevTone==="clay"?"clay":sevTone==="amber"?"amber":"slate"})">
    <div class="row" style="gap:7px;margin-bottom:4px">
      <span class="chip ${sevTone}" style="padding:1px 7px">${esc(t(i.sev))}</span>
      <span class="chip ${stTone}" style="padding:1px 7px">${esc(t(i.status==="open"?"open_i":i.status==="ack"?"acknowledged":"resolved"))}</span>
      <span class="sp" style="flex:1"></span>
      <span class="xsmall faint">${esc(timeAgo(i.ts))}</span></div>
    <div class="small"><b>${esc(r.name)}</b> · ${esc(t("hl_"+i.comp) === "hl_"+i.comp ? i.comp : t("hl_"+i.comp))}</div>
    <div class="small muted" style="margin-top:2px">${esc(i.text)}</div>
    ${i.status !== "resolved" ? `<div class="row" style="gap:7px;margin-top:8px">
      ${i.status === "open" ? `<button class="btn sm ghost" data-ack="${i.id}">${esc(t("hl_ack"))}</button>` : ""}
      <button class="btn sm soft" data-res="${i.id}">${esc(t("hl_resolve"))}</button></div>` : ""}
  </div>`;
}
function timeAgo(ts){
  const s = Math.floor((Date.now() - ts)/1000);
  if (s < 60) return "−" + s + "s";
  if (s < 3600) return "−" + Math.floor(s/60) + "m";
  if (s < 86400) return "−" + Math.floor(s/3600) + "h";
  return "−" + Math.floor(s/86400) + "d";
}

function wireTmPanel(){
  const m = ST.team.find(x => x.id === tmSelected); if (!m) return;
  const role = $("tmRole"), scope = $("tmScope");
  if (role) role.onchange = e => {
    const r = e.target.value;
    if (r === "owner") PERMS.forEach(p => m.perms[p] = true);
    else if (r === "viewer") { PERMS.forEach(p => m.perms[p] = false); m.perms.view = true; }
    m.role = r; saveStore(); renderTeam();
  };
  if (scope) scope.onchange = e => { m.scope = e.target.value; if (m.scope === "all") m.scopes = []; saveStore(); renderTeam(); };
  document.querySelectorAll("[data-perm]").forEach(b => b.onclick = () => {
    const p = b.dataset.perm; m.perms[p] = !m.perms[p]; b.classList.toggle("on", m.perms[p]);
    const lbl = b.closest(".field").querySelector("label span");
    if (lbl) lbl.textContent = "— " + Object.values(m.perms).filter(Boolean).length + "/" + PERMS.length;
  });
  document.querySelectorAll("[data-sc]").forEach(b => b.onclick = () => {
    const id = b.dataset.sc; m.scopes = m.scopes || [];
    const i = m.scopes.indexOf(id);
    if (i >= 0) m.scopes.splice(i,1); else m.scopes.push(id);
    b.classList.toggle("on", i < 0); saveStore();
  });
  const sv = $("tmSave");
  if (sv) sv.onclick = () => { saveStore(); toast(t("tm_saved")); buildNav(); };
  const del = $("tmDel");
  if (del) del.onclick = () => {
    if (!confirm(t("tm_remove_t"))) return;
    ST.team = ST.team.filter(x => x.id !== m.id); saveStore(); tmSelected = ST.team[0] && ST.team[0].id;
    toast(t("tm_removed")); renderTeam(); buildNav();
  };
}

      <span class="xsmall num muted">${O?O.restaurants.reduce((a,r)=>a+usageOf(r).req,0):0} / ${(O?O.restaurants.length:1)*(ST.settings.quota||500)}</span>
    </div>
  </div>`;

function wireChat(scope){
  const msgs = $("msgs"); if (!msgs) return;
  msgs.scrollTop = msgs.scrollHeight;
  const sel = $("chatScope");
  if (sel) sel.onchange = e => { location.hash = e.target.value === "all" ? "#/" : "#/ai"; chats["_s"] = e.target.value; if (route.v === "ai") renderAi(e.target.value); };
  const push = (r, x) => {
    (chats[scope] = chats[scope] || []).push({r, t:x});
    msgs.insertAdjacentHTML("beforeend", `<div class="msg ${r==="u"?"u":r==="err"?"err":"a"}">${md(x)}</div>`);
    msgs.scrollTop = msgs.scrollHeight;
  };
  const call = async (path, body, shown) => {
    if (shown) push("u", shown);
    msgs.insertAdjacentHTML("beforeend", `<div class="msg a typing" id="typing">${esc(t("ai_think"))}</div>`);
    msgs.scrollTop = msgs.scrollHeight;
    let out;
    try {
      const r = await api(path, {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({...body, restaurant: scope, lang: L})});
      const j = await r.json().catch(() => ({}));
      out = r.ok ? ["a", j.answer] : ["err", t("err_" + ({no_key:"no_key",quota:"quota",busy:"busy"}[j.error] || (r.status===503 ? "data" : "failed")))];
    } catch(e){ out = ["err", t("err_failed")]; }
    const ty = $("typing"); if (ty) ty.remove();
    push(...out);
    const u = usageOf({id:scope}); if (scope !== "all" && ST.usage[scope]) { ST.usage[scope].req++; ST.usage[scope].tokens += 900; saveStore(); }
  };
  const f = $("askf");
  if (f) f.onsubmit = e => { e.preventDefault(); const q = $("q").value.trim(); if (!q) return; $("q").value = ""; call(A("ask"), {question:q}, q); };
  const b = $("brief"); if (b) b.onclick = () => call(A("insights"), {}, "✨ " + t("ai_brief"));
  document.querySelectorAll(".chipbtn").forEach(c => c.onclick = () => call(A("ask"), {question:c.textContent}, c.textContent));
}

      <div class="row">
        <button class="btn ghost" id="expJ">${ico("download","sm")} ${esc(t("ad_export_json"))}</button>
        <label class="btn ghost" style="cursor:pointer">${ico("upload","sm")} ${esc(t("ad_import"))}
          <input type="file" id="impJ" accept="application/json" hidden></label>
        <div class="sp" style="flex:1"></div>
        <button class="btn danger" id="rstS">${ico("trash","sm")} ${esc(t("ad_reset"))}</button>
      </div>
      <div class="hint jade" style="margin-top:12px">${ico("db","sm")} ${esc(t("ad_sub"))}</div>`)}</div>`;
    $("expJ").onclick = () => {
      const blob = new Blob([JSON.stringify(ST, null, 2)], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = `nardjis-config-${todayISO()}.json`; a.click(); URL.revokeObjectURL(a.href);
      toast(t("ad_exported"));
    };
    $("impJ").onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const j = JSON.parse(rd.result);
          if (!j || typeof j !== "object" || !j.settings) throw 0;
          ST = loadStore(); ST.settings = Object.assign({}, DEFAULT_SETTINGS, j.settings);
          ST.subs = j.subs || ST.subs; ST.team = j.team || ST.team;
          ST.incidents = j.incidents || ST.incidents; ST.usage = j.usage || ST.usage;
          saveStore(); applyTheme(); setLang(ST.settings.lang); toast(t("ad_imported"));
        } catch(err){ toast(t("ad_import_err")); }
      };
      rd.readAsText(f);
    };
    $("rstS").onclick = () => {
      if (!confirm(t("ad_reset_t"))) return;
      ST = loadStore(); ST.settings = Object.assign({}, DEFAULT_SETTINGS); saveStore();
      applyTheme(); setLang("fr"); toast(t("ad_reset_done")); renderAdmin();
    };
  }
}
function bindSave(pairs, after){
  const btn = document.createElement("div");
  btn.className = "row"; btn.style.marginTop = "16px";
  btn.innerHTML = `<button class="btn" id="sSave">${ico("check","sm")} ${esc(t("save"))}</button>`;
  $("aBody").appendChild(btn);
  $("sSave").onclick = () => {
    pairs.forEach(([id, key, kind]) => {
      const el = $(id); if (!el) return;
      let v = el.value;
      if (kind === "num") v = Math.max(0, +v || 0);
      ST.settings[key] = v;
    });
    saveStore(); toast(t("ad_saved")); if (after) after(); buildNav();
  };
}

/* ============================================================
   Mount / router dispatch
   ============================================================ */
const STATES = {};
function wireDT(r){
  if (tab === "room") paintRoom(r);
  if (tab === "activity"){ const b = $("actRep"); if (b) b.onclick = () => showReport(r); }
  if (tab === "health"){ const b = $("incNew"); if (b) b.onclick = () => openIncidentDlg(r.id); }
  document.querySelectorAll("[data-ack]").forEach(b => b.onclick = () => {
    const i = ST.incidents.find(x => x.id === b.dataset.ack); if (i){ i.status = "ack"; saveStore(); toast(t("hl_upd")); mount(); buildNav(); }
  });
  document.querySelectorAll("[data-res]").forEach(b => b.onclick = () => {
    const i = ST.incidents.find(x => x.id === b.dataset.res); if (i){ i.status = "resolved"; saveStore(); toast(t("hl_upd")); mount(); buildNav(); }
  });
}
function crumbCtx(key){
  if (!O) return "";
  const w = ST.settings.warnDays || 14;
  if (key === "home") return `${O.group.online}/${O.group.count} ${t("online")} · ${t("k_expiring")} : ${expiringCount()}`;
  if (key === "restaurants") return `${O.restaurants.length} ${t("rs_count")}`;
  if (key === "reports") return expiringCount() ? `${t("rp_sum_expiring").replace("{d}", w)} : ${expiringCount()}` : `≤ ${w} ${t("days")}`;
  if (key === "analytics") return `${t("an_range")} : ${t("an_" + anRange)}`;
  if (key === "health") return `${t("hl_incidents")} : ${openIncidents().length}`;
  if (key === "team") return `${t("tm_active_m")} : ${ST.team.length}`;
  if (key === "ai") return `${t("usage_req")} : ${O.restaurants.reduce((a,r)=>a+usageOf(r).req,0)}`;
  if (key === "admin") return String(ST.settings.model || "");
  return "";
}
function mount(){
  if (!authed || !O) return;   // overview not loaded yet — start() will mount when it arrives
  buildNav(); buildMobNav();
  const key = route.v === "rest" ? "restaurants" : route.v;
  const titles = {home:["ov_title","ov_sub"], restaurants:["rs_title","rs_sub"], reports:["rp_title","rp_sub"],
    analytics:["an_title","an_sub"], health:["hl_title","hl_sub"], team:["tm_title","tm_sub"],
    ai:["ai_title","an_sub"], admin:["ad_title","ad_sub"]};
  const r = route.v === "rest" ? (O.restaurants||[]).find(x => x.id === route.id) : null;
  $("crumbT").textContent = r ? r.name : t((titles[key]||["nav_overview"])[0]);
  $("crumbS").textContent = r
    ? t("nav_restaurants") + " / " + t(DTABS.find(d=>d[0]===tab)?.[1] || "dt_room")
    : crumbCtx(key);

  const sw = $("sw");
  if (O){
    sw.hidden = O.restaurants.length < 2;
    sw.innerHTML = `<option value="">${esc(t("all"))}</option>` +
      O.restaurants.map(x => `<option value="${x.id}" ${route.v==="rest"&&route.id===x.id?"selected":""}>${esc(x.name)}</option>`).join("");
  }

  try {
    if (route.v === "home") renderOverview();
    else if (route.v === "restaurants") renderRestaurants();
    else if (route.v === "rest") renderRest();
    else if (route.v === "reports") renderReports();
    else if (route.v === "analytics") renderAnalytics();
    else if (route.v === "health") renderHealth();
    else if (route.v === "team") renderTeam();
    else if (route.v === "ai") renderAi();
    else if (route.v === "admin") renderAdmin();
    else { location.hash = "#/"; return; }
  } catch(err){
    console.error(err);
    $("view").innerHTML = `<div class="card">${emptyBox(t("err_failed"),"alert")}</div>`;
  }
}

/* ============================================================
   Polling
   ============================================================ */
let tickN = 0;
async function tick(force){
  if (!authed) return;
  try {
    const o = await (await api(A("overview"))).json();
    O = o;
    O.restaurants.forEach(subOf);
    tickN++;
    if (route.v === "rest" && route.id){
      const s = await (await api(A("state", {id:route.id}))).json();
      if (s.waiting === undefined){
        STATES[route.id] = s;
        const r = O.restaurants.find(x => x.id === route.id);
        if (tab === "room"){
          if ($("tables")) paintRoom(r); else if (r) drawDTbody(r);
        }
      }
    }
    // keep states warm for the overview feed (cheap: only every 4th tick, one at a time)
    if (route.v === "home" && tickN % 4 === 0){
      const next = O.restaurants.find(x => !STATES[x.id] && !x.starting);
      if (next){
        try { const s = await (await api(A("state", {id:next.id}))).json(); if (s.waiting === undefined) STATES[next.id] = s; } catch(e){}
      }
    }
    recordHistory();
    // don't blow away the DOM while the user is typing / choosing a value
    const ae = document.activeElement;
    const busy = ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && $("view").contains(ae);
    if (!busy){
      if (force || ["home","restaurants","reports","analytics","health"].includes(route.v)) mount();
      else if (route.v === "rest") { buildNav(); }
    } else {
      buildNav(); buildMobNav();
    }
  } catch(e){}
}
function recordHistory(){
  if (!O) return;
  const d = todayISO();
  const served = O.restaurants.reduce((a,r) => a + (r.kpi ? r.kpi.served : 0), 0);
  const alerts = O.restaurants.reduce((a,r) => a + (r.kpi ? r.kpi.alerts : 0), 0);
  const ai = O.restaurants.reduce((a,r) => a + usageOf(r).req, 0);
  const prev = ST.history[d];
  if (!prev || served > prev.served) { ST.history[d] = {served, alerts, ai}; saveStore(); }
}

/* ============================================================
   Boot
   ============================================================ */
async function start(){
  try { O = await (await api(A("overview"))).json(); } catch(e){ return; }
  O.restaurants.forEach(r => { subOf(r); syncLiveUsage(r); });
  parseRoute();
  mount();
  tick();
  setInterval(() => { if (!document.hidden) tick(); }, 3000);
}
function wireShell(){
  $("burger").onclick = () => openSide(!$("side").classList.contains("on"));
  $("scrim").onclick = () => openSide(false);
  $("globeBtn").onclick = e => { e.stopPropagation(); const m = $("globeMenu"); const show = m.hidden; hideMenus(); m.hidden = !show; };
  $("userBtn").onclick = e => { e.stopPropagation(); const m = $("userMenu"); const show = m.hidden; hideMenus(); m.hidden = !show; };
  document.addEventListener("click", e => { if (!e.target.closest(".menu-wrap")) hideMenus(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") hideMenus(); });
  $("themeBtn").onclick = toggleTheme;
  $("miTheme").onclick = () => { toggleTheme(); hideMenus(); };
  $("miLang").onclick = () => { hideMenus(); $("globeMenu").hidden = false; };
  $("logoutBtn").onclick = doLogout;
  $("miOut").onclick = () => { hideMenus(); doLogout(); };
  $("sw").onchange = e => { location.hash = e.target.value ? "#/r/" + e.target.value : "#/"; };
  $("dlgX").onclick = closeDlg;
  $("dlg").addEventListener("click", e => { if (e.target === $("dlg")) closeDlg(); });
  window.dlg = $("dlg"); window.closeDlg = closeDlg; window.toast = toast;
}
async function doLogout(){
  try { await fetch(A("logout"), {method:"POST"}); } catch(e){}
  authed = false;
  showLogin();
}
(async () => {
  wireShell();
  applyTheme();
  setLang(L);
  $("whoRole").textContent = t("role_owner");
  try {
    const a = await (await fetch(A("auth"))).json();
    needCode = a.required; authed = a.ok;
    if (authed) start(); else showLogin(a.configured === false);
  } catch(e){ showLogin(); }
})();
</script>
