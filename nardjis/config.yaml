# Nardjis Solutions - configuration (many restaurants, one file)
# Everything at top level is the DEFAULT for all restaurants; a restaurant can override any block.

language: fr            # fr | en | ar  (Telegram alerts and reports)

# Optional: protects the dashboard (and the AI quota). Can also be set with env NARDJIS_ACCESS_CODE.
access_code: ""

# Gemini AI assistant (free tier from https://aistudio.google.com/apikey)
# Best practice: leave api_key empty and set the environment variable GEMINI_API_KEY.
gemini:
  api_key: ""
  models: [gemini-2.5-flash, gemini-2.5-flash-lite]   # tried in order; change if Google renames them

camera:
  sample_interval: 1.0  # analyse 1 frame per second (enough, and light on CPU)
  model: yolo11n.pt     # downloaded automatically (free). yolo11s.pt = more accurate
  confidence: 0.4

# Staff are recognised by uniform colour (HSV ranges, OpenCV scale H 0-179).
# Default = dark/black apron. Use [] to treat everyone as a client (handy for a first phone test).
staff_uniform:
  min_ratio: 0.25
  ranges:
    - [[0, 0, 0], [180, 255, 60]]

# Seconds
thresholds:
  patience_limit: 600   # a client waiting 10 min = critical
  warn_ratio: 0.5       # first alert to the nearest free employee at 50%
  dirty_after: 120      # table abandoned and not cleaned after 2 min = alert
  remind_every: 180
  visit_seconds: 6
  meters_per_unit: 12   # real width of the camera view in meters

privacy:
  blur_faces: true      # faces always blurred, no face recognition

telegram:
  bot_token: ""         # one bot for all restaurants (create it with @BotFather)

restaurants:
  # Tables = polygons in normalized coordinates (0..1 of the camera image).
  # Draw them with:  python tools/zones.py --source 0
  # weight = difficulty (terrace / far from kitchen > 1) used in the Fair Effort Score.
  - id: oran-centre
    name: "Oran Centre"
    camera: {source: 0}               # 0 = webcam | rtsp://user:pass@ip/stream | http://phone-ip:8080/video
    telegram: {staff_chat_id: "", manager_chat_id: ""}
    staff_names: {1: Amine, 2: Yasmine, 3: Sofiane}
    demo: {seed: 7, attention: 1.0}
    tables: &six_tables
      - {id: T1, name: "Table 1", weight: 1.0, polygon: [[0.08, 0.12], [0.28, 0.12], [0.28, 0.38], [0.08, 0.38]]}
      - {id: T2, name: "Table 2", weight: 1.0, polygon: [[0.40, 0.12], [0.60, 0.12], [0.60, 0.38], [0.40, 0.38]]}
      - {id: T3, name: "Table 3", weight: 1.2, polygon: [[0.72, 0.12], [0.92, 0.12], [0.92, 0.38], [0.72, 0.38]]}
      - {id: T4, name: "Table 4", weight: 1.0, polygon: [[0.08, 0.55], [0.28, 0.55], [0.28, 0.81], [0.08, 0.81]]}
      - {id: T5, name: "Table 5", weight: 1.0, polygon: [[0.40, 0.55], [0.60, 0.55], [0.60, 0.81], [0.40, 0.81]]}
      - {id: T6, name: "Terrasse 6", weight: 1.5, polygon: [[0.72, 0.55], [0.92, 0.55], [0.92, 0.81], [0.72, 0.81]]}

  - id: es-senia
    name: "Es Sénia"
    camera: {source: "rtsp://user:pass@192.168.1.21/stream"}
    telegram: {staff_chat_id: "", manager_chat_id: ""}
    staff_names: {1: Karim, 2: Lamia, 3: Walid}
    demo: {seed: 3, attention: 1.5}
    tables:
      - {id: T1, name: "Table 1", weight: 1.0, polygon: [[0.10, 0.15], [0.40, 0.15], [0.40, 0.45], [0.10, 0.45]]}
      - {id: T2, name: "Table 2", weight: 1.0, polygon: [[0.55, 0.15], [0.90, 0.15], [0.90, 0.45], [0.55, 0.45]]}
      - {id: T3, name: "Table 3", weight: 1.0, polygon: [[0.10, 0.55], [0.40, 0.55], [0.40, 0.85], [0.10, 0.85]]}
      - {id: T4, name: "Salon", weight: 1.3, polygon: [[0.55, 0.55], [0.90, 0.55], [0.90, 0.85], [0.55, 0.85]]}

  - id: bir-el-djir
    name: "Bir El Djir"
    camera: {source: "rtsp://user:pass@192.168.1.22/stream"}
    telegram: {staff_chat_id: "", manager_chat_id: ""}
    staff_names: {1: Nour, 2: Rachid, 3: Imane}
    demo: {seed: 11, attention: 0.55}
    tables: *six_tables
