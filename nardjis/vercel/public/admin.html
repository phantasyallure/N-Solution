<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Nardjis · Platform</title>
<link rel="icon" href="/static/favicon.png">
<script src="/static/brand.js"></script>
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Nardjis Platform — Brand design system (navy / teal / orange)
   ============================================================ */
:root{
  /* Brand palette: navy #102D50, teal #00B8B0, orange #FFA51F */
  --bg:#f4f7fa; --g1:rgba(0,184,176,.28); --g2:rgba(0,184,176,.38); --card:rgba(255,255,255,.76);
  --ink:#222222; --mute:#5b6b7f; --line:rgba(16,45,80,.20);
  --a1:#1a4a7c; --a2:#102d50; --ona:#ffffff;
  --ok:#17704a; --warn:#8f5200; --bad:#b3261e;
  --track:rgba(16,45,80,.11); --nav:rgba(255,255,255,.9); --field:#ffffff; --shadow-c:rgba(16,45,80,.18);
  /* derived (same palette, opaque / helper tones) */
  --solid:#ffffff;
  --acc:var(--a2); --acc-2:var(--a1);
  --surface:var(--card); --surface-2:var(--track);
  --surface-3:color-mix(in srgb,var(--a2) 20%,transparent);
  --ink-2:color-mix(in srgb,var(--ink) 78%,var(--mute)); --muted:var(--mute);
  --faint:color-mix(in srgb,var(--mute) 80%,var(--bg));
  --line-2:color-mix(in srgb,var(--line) 55%,transparent);
  --acc-soft:color-mix(in srgb,var(--acc) 12%,transparent); --acc-line:color-mix(in srgb,var(--acc) 32%,transparent);
  --ok-soft:color-mix(in srgb,var(--ok) 13%,transparent); --ok-line:color-mix(in srgb,var(--ok) 34%,transparent);
  --amber:var(--warn); --amber-soft:color-mix(in srgb,var(--warn) 13%,transparent); --amber-line:color-mix(in srgb,var(--warn) 34%,transparent);
  --clay:var(--bad); --clay-soft:color-mix(in srgb,var(--bad) 11%,transparent); --clay-line:color-mix(in srgb,var(--bad) 32%,transparent);
  --slate:var(--mute); --slate-soft:color-mix(in srgb,var(--mute) 13%,transparent); --slate-line:color-mix(in srgb,var(--mute) 32%,transparent);
  --shadow:0 1px 2px color-mix(in srgb,var(--shadow-c) 60%,transparent), 0 12px 32px -20px var(--shadow-c);
  --shadow-lg:0 24px 60px -30px var(--shadow-c), 0 4px 14px -6px color-mix(in srgb,var(--shadow-c) 70%,transparent);
  --c1:#102d50; --c2:#00b8b0;
  --r:14px; --r-sm:10px; --r-xs:7px;
  --side-w:248px; --top-h:60px;
  --ring-track:color-mix(in srgb,var(--a2) 14%,transparent);
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#0b1b30; --g1:rgba(0,184,176,.24); --g2:rgba(79,214,207,.10); --card:rgba(190,220,245,.055);
  --ink:#eaf1f8; --mute:#9fb3c8; --line:rgba(120,190,235,.19);
  --a1:#4fd6cf; --a2:#00b8b0; --ona:#06182b;
  --ok:#8fe0b4; --warn:#ffa51f; --bad:#ff9aa8;
  --track:rgba(190,220,245,.10); --nav:rgba(11,27,48,.84); --field:#0f2540; --shadow-c:rgba(0,0,0,.5);
  --solid:#12263f;
  --acc:var(--a1); --acc-2:var(--a2);
  --surface-3:rgba(190,220,245,.17);
  --ring-track:rgba(190,220,245,.12);
  --c1:#00b8b0; --c2:#ffa51f;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .25s ease,color .25s ease;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 560px at 6% -6%,var(--g1),transparent 65%),radial-gradient(820px 560px at 100% 0%,var(--g2),transparent 62%);
}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:15px;height:15px}
svg.i.lg{width:22px;height:22px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ================= layout ================= */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;height:100dvh;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-inline-end:1px solid var(--line);
  display:flex;flex-direction:column;z-index:60;overflow:hidden
}
.side-head{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.mark{width:34px;height:34px;border-radius:9px;object-fit:contain;flex:none}
.mark.lg{width:76px;height:76px;border-radius:18px}
.side-badge{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.side-badge b{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.side-badge span{font-size:11px;color:var(--muted);font-weight:500}
.nav{flex:1;overflow-y:auto;padding:6px 10px 14px;display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 10px 5px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  font-size:13.5px;font-weight:500;color:var(--ink-2);position:relative;transition:background .15s,color .15s
}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.nav a.on::before{content:"";position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--acc)}
.nav a .cnt{margin-inline-start:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--surface-3);color:var(--muted)}
.nav a.on .cnt{background:var(--acc-soft);color:var(--acc)}
.nav a .cnt.warn{background:var(--amber-soft);color:var(--amber)}
.side-foot{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}
.who{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r-sm);background:var(--surface-2)}
.who .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ona);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.who .tx{min-width:0}
.who .tx b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .tx span{font-size:11px;color:var(--muted)}

.main{display:flex;flex-direction:column;min-width:0}
.top{
  position:sticky;top:0;z-index:50;background:var(--nav);
  backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)
}
.top-in{display:flex;align-items:center;gap:10px;min-height:var(--top-h);padding:8px 20px;max-width:1440px;margin:auto;width:100%}
.crumb{display:flex;flex-direction:column;min-width:0}
.crumb b{font-size:15.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.view{padding:20px;max-width:1440px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px}

/* ================= controls ================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ona);border:1px solid transparent;border-radius:var(--r-sm);
  padding:0 14px;min-height:38px;font-size:13.5px;font-weight:600;letter-spacing:-.005em;
  transition:background .15s,transform .08s,box-shadow .15s;white-space:nowrap
}
.btn:hover{filter:brightness(1.07);box-shadow:0 6px 16px -8px var(--a2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--field);color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink);filter:none;box-shadow:none}
.btn.soft{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.btn.soft:hover{filter:none;background:color-mix(in srgb,var(--acc) 18%,transparent);box-shadow:none}
.btn.danger{background:var(--clay-soft);color:var(--clay);border-color:transparent}
.btn.danger:hover{filter:none;box-shadow:none;background:color-mix(in srgb,var(--bad) 18%,transparent)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:var(--r-xs)}
.btn.lg{min-height:44px;padding:0 18px;font-size:14.5px}
.btn.block{width:100%}
.ibtn{
  display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-sm);
  background:var(--field);border:1px solid var(--line);color:var(--ink-2);transition:background .15s,color .15s
}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn.bare{border-color:transparent;background:transparent}
.ibtn.bare:hover{background:var(--surface-2)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{padding:0 12px;min-height:30px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--solid);color:var(--ink);box-shadow:0 1px 2px var(--shadow-c)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.inp,select.inp,textarea.inp{
  background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:0 12px;min-height:38px;font-size:13.5px;color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s
}
textarea.inp{padding:10px 12px;min-height:80px;resize:vertical}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.inp::placeholder{color:var(--faint)}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%23a07a8a' stroke-width='2' stroke-linecap='round'><path d='M3 5l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-inline-end:30px}
html[dir=rtl] select.inp{background-position:left 11px center}
.switch{position:relative;display:inline-flex;flex:none;width:40px;height:23px;border-radius:99px;background:var(--surface-3);transition:background .18s;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .18s}
.switch.on{background:linear-gradient(135deg,var(--a1),var(--a2))}
.switch.on::after{transform:translateX(17px)}
html[dir=rtl] .switch.on::after{transform:translateX(-17px)}
.search{position:relative;flex:1;min-width:160px;max-width:340px}
.search .inp{padding-inline-start:36px}
.search svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}

/* dropdown menu (globe / user / row actions) */
.menu-wrap{position:relative}
.menu{
  position:absolute;top:calc(100% + 7px);inset-inline-end:0;min-width:190px;z-index:80;
  background:var(--solid);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-lg);padding:6px;display:flex;flex-direction:column;gap:1px;
  animation:pop .14s ease
}
@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.menu.align-start{inset-inline-end:auto;inset-inline-start:0}
.menu-h{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:7px 9px 4px}
.menu button,.menu a{
  display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;
  font-size:13.5px;color:var(--ink-2);text-align:start;width:100%
}
.menu button:hover,.menu a:hover{background:var(--surface-2);color:var(--ink)}
.menu button.on{color:var(--acc);font-weight:600;background:var(--acc-soft)}
.menu .tick{margin-inline-start:auto;opacity:0}
.menu button.on .tick{opacity:1}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu button.danger{color:var(--clay)}

/* ================= surfaces ================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:450}
.card-h .sp{flex:1}
.page-h{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.page-h h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.page-h p{font-size:13px;color:var(--muted);margin-top:3px;max-width:70ch}
.page-h .sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12px}
.xsmall{font-size:11px}
.b6{font-weight:600}.b7{font-weight:700}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 14px;text-align:center;color:var(--muted);font-size:13px}
.empty svg{width:26px;height:26px;opacity:.5}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi .k-h{display:flex;align-items:center;gap:8px}
.kpi .k-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);flex:none}
.kpi .k-ic.amber{background:var(--amber-soft);color:var(--amber)}
.kpi .k-ic.clay{background:var(--clay-soft);color:var(--clay)}
.kpi .k-ic.slate{background:var(--slate-soft);color:var(--slate)}
.kpi .k-l{font-size:12.5px;color:var(--muted);font-weight:550}
.kpi .k-v{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.kpi .k-v small{font-size:14px;font-weight:600;color:var(--faint);letter-spacing:0}
.kpi .k-s{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.kpi .k-s .up{color:var(--ok);font-weight:650}
.kpi .k-s .down{color:var(--clay);font-weight:650}

/* chips / badges */
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;
  padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);
  border:1px solid transparent;white-space:nowrap;letter-spacing:.005em
}
.chip.acc{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.chip.clay{background:var(--clay-soft);color:var(--clay);border-color:var(--clay-line)}
.chip.slate{background:var(--slate-soft);color:var(--slate);border-color:var(--slate-line)}
.chip.dot{width:auto;height:auto;display:inline-flex;border-radius:99px}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;display:inline-block}
.dot.on{background:var(--ok)}
.dot.off{background:var(--faint)}
.dot.warn{background:var(--amber)}
.dot.demo{background:var(--slate)}
.dot.pulse{box-shadow:0 0 0 0 var(--ok-line);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{
  text-align:start;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap
}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl td.r,table.tbl th.r{text-align:end}
.cellname{display:flex;align-items:center;gap:10px;min-width:0}
.cellname .ico{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;color:var(--acc);flex:none;font-weight:700;font-size:12.5px}
.cellname b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cellname span{font-size:11.5px;color:var(--muted)}

/* progress / rings / meters */
.meter{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;min-width:60px}
.meter>i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .6s cubic-bezier(.4,0,.2,1)}
.meter>i.amber{background:var(--amber)}
.meter>i.clay{background:var(--clay)}
.meter>i.slate{background:var(--slate)}
.ring{--p:0;--c:var(--acc);width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--ring-track) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--solid)}
.ring b{position:relative;z-index:1;font-size:15px;font-weight:700;letter-spacing:-.02em}
.ring.lg{width:84px;height:84px}
.ring.lg::after{inset:9px}
.ring.lg b{font-size:21px}

/* activity feed */
.feed{display:flex;flex-direction:column;gap:7px;max-height:360px;overflow:auto;padding-inline-end:2px}
.ev{font-size:12.5px;padding:9px 11px;border-radius:9px;background:var(--surface-2);border-inline-start:3px solid var(--line);line-height:1.4}
.ev.staff{border-color:var(--amber)}
.ev.manager{border-color:var(--clay);background:var(--clay-soft)}
.ev.ok{border-color:var(--ok)}
.ev b{font-weight:600}

/* staff list */
.staff{display:flex;flex-direction:column;gap:12px}
.st{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);display:grid;place-items:center;font-weight:700;font-size:12.5px;position:relative;flex:none}
.av.top{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ona)}
.av::after{content:"";position:absolute;inset-inline-end:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--solid);background:var(--faint)}
.av.ready::after{background:var(--ok)}
.av.active::after{background:var(--amber)}
.st .row1{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13.5px}
.st .row1 span{color:var(--muted);font-weight:600;font-size:12.5px}
.st .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.eff{height:6px;background:var(--surface-3);border-radius:99px;margin-top:6px;overflow:hidden}
.eff>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .7s}

/* ranking */
.rank{display:flex;flex-direction:column;gap:11px}
.rank a{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 6px;margin:-5px -6px;border-radius:9px}
.rank a:hover{background:var(--surface-2)}
.rank .no{font-size:13px;font-weight:700;color:var(--faint);text-align:center}
.rank .no.first{color:var(--acc)}
.rank .bar2{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:5px}
.rank .bar2>i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .7s}
.rank .sc{font-size:13.5px;font-weight:700}

/* restaurant cards */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rc{
  display:flex;flex-direction:column;gap:12px;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s,border-color .16s;text-align:start
}
.rc:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--acc-line)}
.rc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rn{font-size:16px;font-weight:650;letter-spacing:-.01em}
.rs{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.tsum{display:flex;flex-direction:column;gap:9px}
.tsum-bar{display:flex;gap:3px;height:5px;border-radius:99px;overflow:hidden}
.tsum-bar i{display:block;border-radius:99px;min-width:5px;transition:flex .5s}
.tsum-list{display:flex;flex-wrap:wrap;gap:5px 16px;font-size:12.5px;color:var(--muted);line-height:1.3}
.tsum-list span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tsum-list span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.tsum-list b{font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tsum-none{font-size:12.5px;color:var(--faint)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:18px;height:18px;border-radius:5px;background:var(--surface-3);display:block}
.dots i.occupied,.dots i.waiting.ok{background:var(--ok)}
.dots i.waiting.warn{background:var(--amber)}
.dots i.waiting.critical,.dots i.dirty.critical{background:var(--clay)}
.dots i.dirty{background:var(--slate)}
.rc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px dashed var(--line);padding-top:11px}
.rc-stats b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.rc-stats span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.rc-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* room / tables */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.t{border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;overflow:hidden;background:var(--field)}
.t::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--surface-3)}
html[dir=rtl] .t::before{inset:0 0 0 auto}
.t.occupied::before,.t.waiting.ok::before{background:var(--ok)}
.t.waiting.warn::before{background:var(--amber)}
.t.waiting.critical::before,.t.dirty.critical::before{background:var(--clay)}
.t.dirty::before{background:var(--slate)}
.t.critical{border-color:var(--clay-line)}
.t .n{font-weight:600;padding-inline-end:66px;font-size:13.5px}
.t .s{font-size:11px;color:var(--muted);margin-top:2px;min-height:14px}
.t .time{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:6px 0 5px;font-variant-numeric:tabular-nums}
.badge{position:absolute;top:10px;inset-inline-end:10px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.badge.waiting{background:var(--amber-soft);color:var(--amber)}
.badge.dirty{background:var(--slate-soft);color:var(--slate)}
.badge.occupied{background:var(--ok-soft);color:var(--ok)}
.plan{width:100%;max-height:290px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:block}
.live img{width:100%;border-radius:10px;display:block}

/* AI chat */
.msgs{display:flex;flex-direction:column;gap:9px;max-height:360px;overflow:auto;padding:2px;margin-bottom:12px}
.msg{padding:10px 13px;border-radius:14px;max-width:92%;font-size:13.5px;line-height:1.55;word-wrap:break-word}
.msg.u{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ona);align-self:flex-end;border-end-end-radius:4px}
.msg.a{background:var(--surface-2);border:1px solid var(--line);align-self:flex-start;border-end-start-radius:4px}
.msg.err{background:var(--clay-soft);border-color:var(--clay-line);color:var(--clay);align-self:flex-start}
.msg.typing{color:var(--muted);font-style:italic}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chipbtn{border:1px solid var(--line);background:var(--field);border-radius:99px;padding:7px 13px;font-size:12.5px;color:var(--ink-2);min-height:34px;transition:background .15s,border-color .15s}
.chipbtn:hover{background:var(--surface-2);border-color:var(--acc-line);color:var(--acc)}
.chipbtn:disabled{opacity:.45;pointer-events:none}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 13px;min-height:42px;font-size:14px;background:var(--field)}
.ask input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.hint{font-size:12.5px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:10px;padding:10px 12px}
.hint.acc{color:var(--acc);background:var(--acc-soft);border-color:var(--acc-line)}

/* alerts / banners */
.banner{
  display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-radius:12px;
  background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber);font-size:13px;line-height:1.5
}
.banner.clay{background:var(--clay-soft);border-color:var(--clay-line);color:var(--clay)}
.banner.acc{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc)}
.banner.note{background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}
.banner.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.banner b{font-weight:700}
.banner .sp{flex:1}
.banner .btn{align-self:center}

/* tabs (detail page) */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s
}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}

/* timeline / date strip */
.strip{display:flex;gap:3px;flex-wrap:wrap}
.strip i{width:14px;height:26px;border-radius:4px;background:var(--surface-3);display:block}
.strip i.on{background:var(--ok)}
.strip i.off{background:var(--clay-soft);border:1px solid var(--clay-line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}

/* charts (pure CSS/SVG) */
.chart{width:100%;height:180px;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chart .ar{fill:var(--acc-soft);stroke:none}
.chart .pt{fill:var(--acc);stroke:var(--solid);stroke-width:2}
.chart text{fill:var(--faint);font-size:9.5px;font-family:inherit}
.hbars{display:flex;flex-direction:column;gap:11px}
.donut{--p:0;--c:var(--acc);width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--ring-track) 0);display:grid;place-items:center;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--solid)}
.donut b{position:relative;z-index:1;font-size:19px;font-weight:700;letter-spacing:-.02em;text-align:center;line-height:1.1}
.donut b small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* permission matrix */
.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:9px}
.perm{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:13px;transition:border-color .15s,background .15s;text-align:start;width:100%}
.perm:hover{border-color:var(--acc-line)}
.perm.on{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc);font-weight:600}
.perm .box{width:17px;height:17px;border-radius:5px;border:1.6px solid var(--faint);display:grid;place-items:center;flex:none;background:var(--field)}
.perm.on .box{background:var(--acc);border-color:var(--acc);color:var(--ona)}
.perm .box svg{width:11px;height:11px;stroke-width:3;opacity:0}
.perm.on .box svg{opacity:1}
.perm span{min-width:0}

/* login */
.login{max-width:380px;margin:7vh auto;display:flex;flex-direction:column;gap:13px;align-items:center;text-align:center}
.login .mark.lg{box-shadow:var(--shadow)}
.login h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
.login p{font-size:13px;color:var(--muted);margin-top:-6px}
.login .box{width:100%;display:flex;flex-direction:column;gap:11px;background:var(--solid);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.login input{text-align:center;min-height:46px;font-size:15px;letter-spacing:.16em}
.login .err{color:var(--clay);font-size:12.5px;min-height:16px}

/* dialog + toast */
dialog{
  border:1px solid var(--line);background:var(--solid);color:var(--ink);border-radius:16px;margin:auto;
  padding:0;max-width:520px;width:calc(100% - 24px);box-shadow:var(--shadow-lg);max-height:88vh;max-height:88dvh;overflow:auto
}
dialog::backdrop{background:rgba(8,22,40,.55);backdrop-filter:blur(3px)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--solid);z-index:2}
.dlg-h h3{font-size:15.5px;font-weight:650;letter-spacing:-.01em;flex:1}
.dlg-b{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg-f{display:flex;gap:9px;justify-content:flex-end;padding:15px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--solid)}
dialog pre{white-space:pre-wrap;font:inherit;font-size:13px;line-height:1.7;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:46vh;overflow:auto}
#toast{
  position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));inset-inline-start:50%;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:11px;font-size:13.5px;font-weight:550;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.24s;z-index:200;max-width:88vw;text-align:center
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* skeleton */
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}


/* ---- additions: brand fallback, login mode, preview bar, charts, team ---- */
.mark-fb{display:grid;place-items:center;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ona);font-weight:800;font-size:17px}
body.login-mode .side,body.login-mode .top,body.login-mode .mobnav,body.login-mode .pvbar,body.login-mode .scrim{display:none!important}
body.login-mode .app{grid-template-columns:minmax(0,1fr)}
.pvbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 20px;background:var(--amber-soft);color:var(--amber);border-bottom:1px solid var(--amber-line);font-size:13px;font-weight:600}
.pvbar span{flex:1;min-width:200px}
.hbar{display:flex;flex-direction:column;gap:6px;font-size:13px}
.hbar .hb-t{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.hbar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550;min-width:0}
.hbar .val{font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px;flex:none}
.chart-box{position:relative;width:100%;touch-action:pan-y}
.chart-box svg{display:block;overflow:visible}
.chart-box .gl{stroke:var(--line);stroke-width:1;shape-rendering:crispEdges}
.chart-box .yt,.chart-box .xt{fill:var(--muted);font-size:11px;font-family:inherit;font-variant-numeric:tabular-nums}
.chart-box .ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart-box .xh{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
.chart-box .bar{transition:opacity .12s}
.chart-box.hov .bar{opacity:.45}
.chart-box.hov .bar.hv{opacity:1}
.ctip{position:absolute;top:0;left:0;pointer-events:none;background:var(--solid);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow-lg);white-space:nowrap;z-index:5;line-height:1.35}
.ctip b{display:block;font-size:11px;color:var(--muted);font-weight:600}
.ctip span{font-weight:700;font-variant-numeric:tabular-nums}
.ring-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center}
.ring-svg{flex:none}
.ring-svg .rn{fill:var(--ink);font-size:26px;font-weight:700;letter-spacing:-.02em}
.ring-svg .rs{fill:var(--muted);font-size:10.5px;font-weight:600}
.lg-list{display:grid;gap:10px;font-size:13px;min-width:150px}
.lg-list .li{display:flex;align-items:center;gap:9px}
.lg-list .li i{width:10px;height:10px;border-radius:3px;flex:none}
.lg-list .li b{margin-inline-start:auto;padding-inline-start:14px;font-variant-numeric:tabular-nums}
.card.full-h{display:flex;flex-direction:column}
.chart-sum{display:flex;gap:22px;flex-wrap:wrap;margin:-4px 0 12px}
.chart-sum div{display:flex;flex-direction:column;gap:2px}
.chart-sum b{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chart-sum span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.copy-row{display:flex;gap:8px;align-items:center}
.copy-row .inp{font-variant-numeric:tabular-nums}
.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.14em;font-weight:700;text-align:center}
.cred{display:grid;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px}
.cred .r{display:grid;gap:3px}
.cred .r small{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cred .r span{font-size:14px;word-break:break-all;font-weight:600}
.cred .r.code span{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.14em}
.perm-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.mem-row{cursor:pointer}
.mem-row.sel{background:var(--acc-soft)!important}
.field .err{font-size:12px;color:var(--bad);min-height:0}
.av.lg{width:44px;height:44px;font-size:16px}
.av.acc{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--ona)}

/* mobile shell */
.scrim{position:fixed;inset:0;background:rgba(8,22,40,.5);opacity:0;pointer-events:none;transition:opacity .22s;z-index:55}
.scrim.on{opacity:1;pointer-events:auto}
.burger{display:none}
.mobnav{display:none}

@media(max-width:1023px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{
    position:fixed;inset-block:0;inset-inline-start:0;width:var(--side-w);
    transform:translateX(-102%);transition:transform .24s cubic-bezier(.4,0,.2,1);box-shadow:none
  }
  html[dir=rtl] .side{transform:translateX(102%)}
  .side.on{transform:none;box-shadow:var(--shadow-lg)}
  html[dir=rtl] .side.on{transform:none}
  .burger{display:inline-grid}
  .top-in{padding:8px 14px}
  .view{padding:16px 14px calc(28px + env(safe-area-inset-bottom));gap:15px}
  .split,.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .g4.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rgrid{grid-template-columns:minmax(0,1fr)}
  .mobnav{
    display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);position:fixed;bottom:0;inset-inline:0;z-index:50;
    background:var(--nav);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))
  }
  .mobnav button{
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:650;
    color:var(--muted);min-height:50px;border-radius:10px;justify-content:center;position:relative
  }
  .mobnav button.on{color:var(--acc)}
  .mobnav .badge-n{
    position:absolute;top:4px;inset-inline-end:calc(50% - 20px);min-width:15px;height:15px;padding:0 4px;
    border-radius:99px;background:var(--clay);color:var(--ona);font-size:9.5px;font-weight:700;display:grid;place-items:center
  }
  .view{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .card{padding:15px}
  .page-h h2{font-size:18px}
  .search{max-width:none}
  /* stacked tables on phones */
  table.tbl.stackable thead{display:none}
  table.tbl.stackable,table.tbl.stackable tbody,table.tbl.stackable tr,table.tbl.stackable td{display:block;width:100%}
  table.tbl.stackable tr{border-bottom:1px solid var(--line);padding:6px 4px}
  table.tbl.stackable tr:last-child{border-bottom:0}
  table.tbl.stackable td{
    border:0;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:end
  }
  table.tbl.stackable td::before{
    content:attr(data-l);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--faint);text-align:start;flex:none
  }
  table.tbl.stackable td:empty{display:none}
  table.tbl.stackable td.full{display:block;text-align:start}
  table.tbl.stackable td.full::before{display:block;margin-bottom:5px}
  .hide-sm{display:none!important}
}
@media(max-width:560px){
  .g4.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .g4.kpis .card{padding:12px}
  .top-in{gap:7px}
  .crumb b{font-size:14.5px}
  .crumb span{display:none}
  .kpi .k-v{font-size:23px}
  .pvbar{padding:9px 12px}
  .hide-xs{display:none!important}
  .btn{padding:0 12px}
  .view{padding-inline:12px}
  .card-h{gap:8px}
  .tables{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .t .time{font-size:22px}
  .dlg-f{flex-wrap:wrap;padding:13px 16px}
  .dlg-f .btn{flex:1 1 auto;justify-content:center}
}
@media(max-width:359px){.g4.kpis{grid-template-columns:minmax(0,1fr)}}
@media print{.side,.top,.mobnav{display:none}.app{grid-template-columns:1fr}.view{padding:0}}
</style>

<body>

<div class="app">
  <aside class="side" id="side">
    <div class="side-head">
      <img class="mark" src="/static/emblem.png" alt="Nardjis" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'mark mark-fb',textContent:'N'}))">
      <div class="side-badge"><b id="brandName">Nardjis</b><span id="brandSub">Platform</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="who">
        <div class="av" id="whoAv">AD</div>
        <div class="tx"><b id="whoName">Admin</b><span id="whoRole">Owner</span></div>

/* deterministic pseudo-random from a string (stable demo data) */
function seedOf(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t>>>15), t | 1); t ^= t + Math.imul(t ^ (t>>>7), t | 61); return ((t ^ (t>>>14)) >>> 0) / 4294967296; }; }

/* --- derived per-restaurant admin data (seeded, then editable) --- */
function subOf(r){
  if (ST.subs[r.id]) return ST.subs[r.id];
  const rand = rng(seedOf("sub:" + r.id));
  const plan = rand() < 0.55 ? "monthly" : "yearly";
  const monthsBack = Math.floor(rand()*14) + 1;
  let start = new Date(Date.now() - monthsBack*30*DAY - Math.floor(rand()*20)*DAY);
  const dur = plan === "yearly" ? 365 : 30;
  // roll forward so the current period is the last one
  let end = new Date(start.getTime() + dur*DAY);
  while (end.getTime() < Date.now() + DAY) { start = new Date(start.getTime() + dur*DAY); end = new Date(start.getTime() + dur*DAY); }
  const s = {
    plan, price: plan === "yearly" ? ST.settings.yearly : ST.settings.monthly,
    start: todayISO(start), end: todayISO(end),
    auto: rand() > 0.2, status: "active",
  };
  const left = daysBetween(todayISO(), s.end);
  if (left < 0) s.status = "expired";
  ST.subs[r.id] = s;
  return s;
}
function subStatus(s){
  const left = daysBetween(todayISO(), s.end);
  if (left < 0) return "expired";
  if (left <= (ST.settings.warnDays||14)) return "expiring";
  if (s.status === "trial") return "trial";
  return "active";
}
function usageOf(r){
  if (ST.usage[r.id]) return ST.usage[r.id];
  const rand = rng(seedOf("use:" + r.id));
  const on = [], off = [];
  for (let i=29;i>=0;i--){
    const d = addDays(todayISO(), -i);
    const p = rand();
    const isOn = i === 0 ? !!r.online : p > 0.13;
    (isOn ? on : off).push(d);
    if (i === 0 && !r.online) off.push(d);
  }
  const uniqOff = [...new Set(off)];
  const uniqOn = [...new Set(on)].filter(d => !uniqOff.includes(d));
  const u = {
    req: Math.floor(rand()*(ST.settings.quota||500)*0.8) + 5,
    tokens: 0, on: uniqOn, off: uniqOff,
    served: 0, abandoned: 0, visits: 0,
  };
  u.tokens = u.req * (600 + Math.floor(rand()*900));
  ST.usage[r.id] = u;
  return u;
}
function syncLiveUsage(r){
  const u = usageOf(r);
  if (r.kpi){ u.served = r.kpi.served||0; u.abandoned = r.kpi.abandoned||0; }
  if (r.staff) u.visits = r.staff.reduce((a,s)=>a+(s.visits||0),0);
  const t = todayISO();
  if (r.online){ if (!u.on.includes(t)) u.on.push(t); u.off = u.off.filter(d=>d!==t); }
  else { if (!u.off.includes(t)) u.off.push(t); u.on = u.on.filter(d=>d!==t); }
  return u;
}

function parseRoute(){
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  if (!parts.length) route = {v:"home"};
  else if (parts[0] === "r") route = {v:"rest", id:parts[1], tab:parts[2] || "room"};
  else if (parts[0] === "admin"){ const sec = SYS.some(z => z[0] === parts[1]) ? parts[1] : "general"; route = {v:"admin", sec}; aTab = sec; }
  else route = {v:parts[0]};
}

function collectFeed(){
  const out = [];
  O.restaurants.forEach(r => {
    const st = STATES[r.id];
    if (!st || !st.events) return;
    [...st.events].reverse().slice(0, 4).forEach(e => {
      const txt = evText(e); if (!txt) return;
      out.push({cls: e.notify || ((e.type==="served"||e.type==="cleaned") ? "ok" : ""), html:`<b>${esc(r.name)}</b> — ${txt}`, ts:e.ts||0});
    });
  });
  return out.slice(0, 8);
}
function tableSummary(r){
  const tb = r.tables || [];
  if (!tb.length) return `<div class="tsum"><span class="tsum-none">—</span></div>`;
  const defs = [
    ["occupied", "occupied_l", "var(--ok)"],
    ["waiting",  "waiting_l",  "var(--amber)"],
    ["dirty",    "dirty_l",    "var(--slate)"],
    ["free",     "free_l",     "var(--surface-3)"],
  ];
  const parts = defs.map(([k, lb, c]) => {
    const list = tb.filter(x => x.state === k);
    if (!list.length) return null;
    if (list.some(x => x.level === "critical")) c = "var(--clay)";
    else if (list.some(x => x.level === "warn") && k !== "waiting") c = "var(--amber)";
    return {n:list.length, label:t(lb), c, k};
  }).filter(Boolean);
  return `<div class="tsum">
    <div class="tsum-bar">${parts.map(p => `<i style="flex:${p.n};background:${p.c}"></i>`).join("")}</div>
    <div class="tsum-list">${parts.map(p => `<span style="--c:${p.k==="free"?"var(--faint)":p.c}"><b>${p.n}</b>${esc(p.label)}</span>`).join("")}</div>
  </div>`;
}

    <div id="dtBody"></div>`;

  $("dtBack").onclick = () => history.length > 1 ? history.back() : (location.hash = "#/restaurants");
  $("dtReport").onclick = () => showReport(r);
  $("dtType").onchange = e => { ST.types[r.id] = e.target.value; saveStore(); toast(t("toast_saved")); mount(); };

}
function drawDTbody(r){

}
async function showReport(r){

  return `
    <div class="grid g4 kpis">

function paintRoom(r){
  if (!r) return;
  const st = STATES[r.id]; if (!st || tab !== "room" || route.v !== "rest") return;
  const T2 = T(), m = st.meta || {};
  const tbl = $("tables"); if (!tbl) return;
  tbl.innerHTML = st.tables.map(x => {
    const sec = x.state==="waiting" ? x.wait : x.state==="dirty" ? x.dirty : x.state==="occupied" ? x.seated : 0;
    const p = x.state==="waiting" ? Math.min(x.patience,1)*100 : x.state==="dirty" ? Math.min(x.dirty/(2*(m.dirty_after||120)),1)*100 : 0;
    const tone = x.state==="free" ? "var(--faint)" : stateCol(x.state);
    const lbl = x.state==="free" ? t("free_l") : x.state==="occupied" ? t("occupied_l") : x.state==="waiting" ? t("waiting_l") : t("dirty_l");
    return `<div class="t ${x.state} ${x.level}"><span class="badge ${x.state}">${esc(lbl)}</span>
      <div class="n">${esc(x.name)}</div>
      <div class="s">${x.clients ? x.clients + " " + esc(t("clients")) : ""}</div>
      <div class="time" style="color:${tone}">${x.state==="free"?"—":mm(sec)}</div>
      <div class="meter"><i class="${x.level==="critical"?"clay":x.level==="warn"?"amber":""}" style="width:${p}%"></i></div></div>`;
  }).join("");
  let svg = "";
  st.tables.forEach(x => {
    const pts = x.polygon.map(p => (p[0]*100)+","+(p[1]*62)).join(" ");
    const c = stateCol(x.state);
    svg += `<polygon points="${pts}" fill="${c}" fill-opacity="${x.state==="free"?.14:.24}" stroke="${c}" stroke-width=".5"/>
      <text x="${x.center[0]*100}" y="${x.center[1]*62}" font-size="2.4" text-anchor="middle" dominant-baseline="middle" fill="currentColor" font-weight="600">${esc(x.name)}</text>`;
  });
  (st.staff||[]).forEach((s,i) => { if (!s.pos || s.status === "away") return;
    svg += `<g style="transform:translate(${s.pos[0]*100}px,${s.pos[1]*62}px);transition:transform .6s linear">
      <circle r="2.6" fill="${i===0&&s.effort>0?"var(--acc)":"var(--ink)"}" stroke="var(--surface)" stroke-width=".5"/>
      <text y=".1" font-size="2.6" fill="var(--surface)" text-anchor="middle" dominant-baseline="middle" font-weight="600">${esc(s.name[0])}</text></g>`; });
  const pl = $("plan"); if (pl) pl.innerHTML = svg;

  const mx = Math.max(1, ...(st.staff||[]).map(s => s.effort));
  const sf = $("staff");
  if (sf) sf.innerHTML = (st.staff||[]).length ? st.staff.map((s,i) => `
    <div class="st"><div class="av ${s.status} ${i===0&&s.effort>0?"top":""}">${esc(s.name[0])}</div>
      <div><div class="row1"><span>${esc(s.name)}${i===0&&s.effort>0?" ★":""}</span><span>${Math.round(100*s.effort/mx)}</span></div>
      <div class="eff"><i style="width:${100*s.effort/mx}%"></i></div>
      <div class="meta">${esc(t(s.status==="ready"?"ready":s.status==="active"?"active_s":"away"))} · ${s.visits} ${esc(t("visits"))} · ${s.tasks_done} ${esc(t("done_s"))} · ${s.distance_m} m${s.avg_response!=null?" · "+esc(t("resp"))+" "+mm(s.avg_response):""}</div></div></div>`).join("")
    : emptyBox(t("none_l"));
  const w = [...(st.waits||[])].sort((a,b) => b.seconds - a.seconds).slice(0,6);
  const wl = $("waits");
  if (wl) wl.innerHTML = w.length ? `<div class="rank">${w.map(x => `
    <div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;padding-bottom:7px;border-bottom:1px dashed var(--line)">
      <span>${esc(x.table)} · <span class="muted">${esc(x.kind==="abandoned"?t("abandoned"):(x.staff||t("served_l")))}</span></span>
      <b class="num">${mm(x.seconds)}</b></div>`).join("")}</div>` : emptyBox(t("none_l"));
  const f = [...(st.events||[])].reverse().map(e => ({e, x:evText(e)})).filter(z => z.x).slice(0,14);
  const fl = $("feed");
  if (fl) fl.innerHTML = f.length ? f.map(({e,x}) => `<div class="ev ${e.notify || ((e.type==="served"||e.type==="cleaned")?"ok":"")}">${x}</div>`).join("") : emptyBox(t("none_l"));
  if (m.mode === "live") { const im = $("live");
    if (im && !im.src) { im.onerror = () => { const c = im.closest(".card"); if (c) c.hidden = true; }; im.src = A("live", {id:r.id, t:Date.now()}); } }
}

/* ---- usage & uptime ---- */
function dtUsage(r){
  const u = syncLiveUsage(r);
  const quota = ST.settings.quota || 500;
  const usedPct = clamp(u.req / quota * 100, 0, 100);
  const onN = u.on.length, offN = u.off.length, tot = Math.max(1, onN + offN);
  const strip = [];
  for (let i = 29; i >= 0; i--){
    const d = addDays(todayISO(), -i);
    strip.push(`<i class="${u.on.includes(d)?"on":u.off.includes(d)?"off":""}" title="${d}"></i>`);
  }
  const q = r.kpi || {};
  return `
    <div class="grid g4 kpis">
      ${kpi({ic:"ai", label:t("usage_req"), value:`${u.req}<small>/${quota}</small>`, sub:`${esc(t("usage_left"))} : ${Math.max(0,quota-u.req)}<span class="meter" style="width:100%;margin-top:7px"><i class="${usedPct>85?"amber":""}" style="width:${usedPct}%"></i></span>`})}
      ${kpi({ic:"db", tone:"slate", label:t("usage_tokens"), value:(u.tokens/1000).toFixed(1)+"k", sub:`~${Math.round(u.tokens/Math.max(1,u.req))} / ${esc(t("usage_req"))}`})}
      ${kpi({ic:"clock", tone:"amber", label:t("usage_uptime"), value:pct(onN/tot*100), sub:`${onN} ${esc(t("days_on_label"))} · ${offN} ${esc(t("days_off_label"))}`})}
      ${kpi({ic:"team", label:t("usage_served"), value:q.served??0, sub:`${esc(t("usage_abandoned"))} : ${q.abandoned??0}`})}
    </div>
    <div class="split">
      <div class="stack">
        <div class="card">
          <div class="card-h"><h3>${ico("calendar")} ${esc(t("usage_strip"))}</h3><div class="sp"></div>
            <span class="sub">${esc(t("usage_uptime"))} : ${pct(onN/tot*100)}</span></div>
          <div class="strip">${strip.join("")}</div>
          <div class="legend" style="margin-top:12px">
            <span><i style="background:var(--ok)"></i>${esc(t("days_on_label"))} — ${onN}</span>
            <span><i style="background:var(--clay-soft);border:1px solid var(--clay-line)"></i>${esc(t("days_off_label"))} — ${offN}</span>
            <span><i style="background:var(--surface-3)"></i>–</span>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>${ico("ai")} ${esc(t("usage_ai"))}</h3></div>
          <div class="stack" style="gap:13px">
            ${hbar(esc(t("usage_req")), u.req, quota, `${u.req} / ${quota}`, usedPct>85?"amber":"")}
            ${hbar(esc(t("usage_tokens")), u.tokens, quota*1500, (u.tokens/1000).toFixed(1)+"k", "slate")}
            ${hbar(esc(t("usage_visits")), u.visits, Math.max(1,u.visits), String(u.visits), "")}
            ${hbar(esc(t("usage_served")), u.served, Math.max(1,u.served), String(u.served), "")}
          </div>
        </div>
      </div>
      <div class="stack">
        <div class="card">
          <div class="card-h"><h3>${ico("zap")} ${esc(t("summary"))}</h3></div>
          <div style="display:grid;gap:11px">
            <div class="row" style="justify-content:space-between"><span class="muted small">${esc(t("usage_served"))}</span><b class="num">${q.served??0}</b></div>
            <div class="row" style="justify-content:space-between"><span class="muted small">${esc(t("usage_abandoned"))}</span><b class="num" style="color:${(q.abandoned??0)>0?"var(--clay)":"inherit"}">${q.abandoned??0}</b></div>
            <div class="row" style="justify-content:space-between"><span class="muted small">${esc(t("usage_alerts_n"))}</span><b class="num">${q.alerts??0}</b></div>
            <div class="row" style="justify-content:space-between"><span class="muted small">${esc(t("usage_visits"))}</span><b class="num">${u.visits}</b></div>
            <div class="row" style="justify-content:space-between"><span class="muted small">${esc(t("k_avg_wait"))}</span><b class="num">${q.avg_wait!=null?mm(q.avg_wait):"–"}</b></div>
          </div>

          <div class="card-h"><h3>${ico("clock")} ${esc(t("usage_off"))}</h3></div>

function exportCsv(list){
  const head = ["restaurant","id","plan","start","end","days_left","price","status","ai_requests","days_on_30","days_off_30","health"];
  const lines = [head.join(",")];
  list.forEach(x => {
    const u = syncLiveUsage(x.r);
    lines.push([`"${x.r.name}"`, x.r.id, x.s.plan, x.s.start, x.s.end, x.left, x.s.price, x.st,
      u.req, u.on.length, u.off.length, x.r.health ?? ""].join(","));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8"});

/* ============================================================
   View: ANALYTICS
   ============================================================ */
let anRange = 30;
/* ---- chart engine: real-pixel SVG (no stretching), axis, hover tooltip ---- */
const CH = {}; let chartRO = null;
const fmtN = n => { const a = Math.abs(n); const loc = L==="ar"?"ar-DZ":L==="fr"?"fr-FR":"en-GB";
  return a >= 10000 ? (n/1000).toFixed(a >= 100000 ? 0 : 1).replace(/\.0$/,"") + "k" : Math.round(n).toLocaleString(loc); };
function niceMax(v){
  if (v <= 0) return 4;
  const p = Math.pow(10, Math.floor(Math.log10(v/4)));
  const m = [1,2,2.5,5,10].find(k => k*p*4 >= v - 1e-9);
  return m*p*4;
}
function chartBox(id, spec){ CH[id] = spec; return `<div class="chart-box" data-ch="${id}" style="height:${spec.h||220}px"></div>`; }
function drawChart(el){
  const sp = CH[el.dataset.ch]; if (!sp) return;
  const W = el.clientWidth, H = sp.h || 220; if (W < 60) return;
  const m = {l:42, r:12, t:12, b:26}, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const vals = sp.values, n = vals.length, bar = sp.kind === "bar";
  const max = niceMax(Math.max(0, ...vals));
  const x = i => m.l + (bar ? (i+.5)*pw/n : (n === 1 ? pw/2 : i*pw/(n-1)));
  const y = v => m.t + ph - v/max*ph;
  const col = sp.color || "var(--c1)", gid = "g" + el.dataset.ch;
  let grid = "";
  for (let k = 0; k <= 4; k++){ const v = max/4*k, yy = Math.round(y(v)) + .5;
    grid += `<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text class="yt" x="${m.l-8}" y="${yy+4}" text-anchor="end">${fmtN(v)}</text>`; }
  const per = Math.max(2, Math.floor(pw/70)), step = Math.max(1, Math.ceil(n/per));
  let xl = "";
  for (let i = n-1; i >= 0; i -= step){
    const anchor = (!bar && i === 0) ? "start" : (!bar && i === n-1) ? "end" : "middle";
    xl += `<text class="xt" x="${x(i)}" y="${H-7}" text-anchor="${anchor}">${esc(sp.labels[i])}</text>`;
  }
  let marks = "";
  if (bar){
    const slot = pw/n, bw = Math.max(1.5, Math.min(22, slot*.62));
    marks = vals.map((v,i) => {
      if (v <= 0) return "";
      const x0 = x(i) - bw/2, x1 = x0 + bw, yt = y(v), yb = m.t + ph, r = Math.min(4, bw/2, (yb-yt));
      return `<path class="bar" data-i="${i}" fill="${col}" d="M${x0},${yb} V${yt+r} Q${x0},${yt} ${x0+r},${yt} H${x1-r} Q${x1},${yt} ${x1},${yt+r} V${yb} Z"/>`;
    }).join("");
  } else {
    const pts = vals.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    const area = `M${x(0).toFixed(1)},${m.t+ph} L` + pts.join(" L") + ` L${x(n-1).toFixed(1)},${m.t+ph} Z`;
    marks = `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${col};stop-opacity:.26"/><stop offset="1" style="stop-color:${col};stop-opacity:0"/></linearGradient></defs>
      <path d="${area}" fill="url(#${gid})"/><polyline class="ln" stroke="${col}" points="${pts.join(" ")}"/>
      <circle cx="${x(n-1)}" cy="${y(vals[n-1])}" r="4" fill="${col}" stroke="var(--solid)" stroke-width="2"/>
      <g class="xh-g" hidden><line class="xh" y1="${m.t}" y2="${m.t+ph}"/><circle r="4.5" fill="${col}" stroke="var(--solid)" stroke-width="2"/></g>`;
  }
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sp.name||"")}">${grid}${xl}${marks}</svg><div class="ctip" hidden></div>`;
  const svg = el.firstChild, tip = el.lastChild, xg = svg.querySelector(".xh-g");
  const show = ev => {
    const rc = el.getBoundingClientRect(), px = ev.clientX - rc.left;
    let i = bar ? Math.floor((px - m.l) / (pw/n)) : Math.round((px - m.l) / (pw/Math.max(1,n-1)));
    i = clamp(i, 0, n-1);
    tip.hidden = false;
    tip.innerHTML = `<b>${esc(sp.labels[i])}</b><span>${fmtN(vals[i])}${sp.unit?" "+esc(sp.unit):""}</span>`;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = clamp(x(i) - tw/2, 0, W - tw) + "px";
    tip.style.top = Math.max(0, y(vals[i]) - th - 12) + "px";
    if (xg){ xg.hidden = false; xg.querySelector("line").setAttribute("x1", x(i)); xg.querySelector("line").setAttribute("x2", x(i));
      const c = xg.querySelector("circle"); c.setAttribute("cx", x(i)); c.setAttribute("cy", y(vals[i])); }
    if (bar){ el.classList.add("hov"); svg.querySelectorAll(".bar").forEach(b => b.classList.toggle("hv", +b.dataset.i === i)); }
  };
  const hide = () => { tip.hidden = true; if (xg) xg.hidden = true; el.classList.remove("hov"); };
  el.onpointermove = show; el.onpointerdown = show; el.onpointerleave = hide; el.onpointercancel = hide;
}
function drawCharts(){
  if (chartRO) chartRO.disconnect();
  const boxes = document.querySelectorAll("[data-ch]");
  if (typeof ResizeObserver === "undefined"){ boxes.forEach(drawChart); return; }
  chartRO = new ResizeObserver(es => es.forEach(e => drawChart(e.target)));
  boxes.forEach(b => chartRO.observe(b));
}
function ringChart(parts, center, sub){
  const tot = parts.reduce((a,p) => a + p.v, 0), R = 52, C = 2*Math.PI*R, live = parts.filter(p => p.v > 0), gap = live.length > 1 ? 3 : 0;
  let off = 0;
  const segs = live.map(p => { const len = p.v/tot*C, d = Math.max(0, len - gap);
    const e = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${p.color}" stroke-width="14" stroke-dasharray="${d} ${C-d}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(p.label)} : ${p.v}</title></circle>`;
    off += len; return e; }).join("");
  return `<svg class="ring-svg" viewBox="0 0 140 140" width="140" height="140" role="img"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--ring-track)" stroke-width="14"/>${segs}
    <text class="rn" x="70" y="68" text-anchor="middle">${esc(center)}</text><text class="rs" x="70" y="87" text-anchor="middle">${esc(sub||"")}</text></svg>`;
}

function incRow(i){
  const sevTone = i.sev === "critical" ? "clay" : i.sev === "warning" ? "amber" : "slate";

      <button class="btn sm soft" data-res="${i.id}">${esc(t("hl_resolve"))}</button></div>` : ""}

function timeAgo(ts){
  const s = Math.floor((Date.now() - ts)/1000);
  if (s < 60) return "−" + s + "s";
  if (s < 3600) return "−" + Math.floor(s/60) + "m";
  if (s < 86400) return "−" + Math.floor(s/3600) + "h";
  return "−" + Math.floor(s/86400) + "d";
}

    if (v && ST.team.some(x => x.id !== m.id && x.email.toLowerCase() === v.toLowerCase())){ err.textContent = t("tm_dup"); return; }

  on("tmStatus","onchange", e => { m.status = e.target.value; save(); renderTeam(); });
  on("tmScope","onchange", e => { m.scope = e.target.value; save(); renderTeam(); });

    if (owner) return;

  });
  on("tmAllOn","onclick", () => { PERMS.forEach(p => m.perms[p] = true); save(); renderTeam(); });
  on("tmAllOff","onclick", () => { PERMS.forEach(p => m.perms[p] = false); save(); renderTeam(); });
  document.querySelectorAll("#tmScopes [data-sc]").forEach(b => b.onclick = () => {
    const id = b.dataset.sc; m.scopes = m.scopes || []; const i = m.scopes.indexOf(id);

  });
}

function chatHTML(scope){

      </select>

    ${!aiOk ? `<div class="hint">${ico("alert","sm")} ${esc(t("ai_no_key"))}
      <a href="#/admin" style="display:block;margin-top:6px;font-weight:700">${esc(t("ai_cfg"))} →</a></div>` : ""}
    <div class="msgs" id="msgs">${list.map(m => `<div class="msg ${m.r==="u"?"u":m.r==="err"?"err":"a"}">${md(m.t)}</div>`).join("")}</div>
    <div class="chips">${chips.map(c => `<button class="chipbtn" ${aiOk?"":"disabled"}>${esc(c)}</button>`).join("")}</div>
    <form class="ask" id="askf"><input id="q" placeholder="${esc(t("ai_ph"))}" ${aiOk?"":"disabled"} autocomplete="off" enterkeyhint="send">
      <button class="btn" ${aiOk?"":"disabled"}>${ico("send","sm")}</button></form>
    <div class="row" style="margin-top:11px;gap:9px">
      <span class="xsmall muted">${esc(t("ai_usage_s"))}</span>
      <span class="meter" style="flex:1;max-width:220px"><i style="width:${clamp((O?O.restaurants.reduce((a,r)=>a+usageOf(r).req,0):0)/Math.max(1,(O?O.restaurants.length:1)*(ST.settings.quota||500))*100,2,100)}%"></i></span>
      <span class="xsmall num muted">${O?O.restaurants.reduce((a,r)=>a+usageOf(r).req,0):0} / ${(O?O.restaurants.length:1)*(ST.settings.quota||500)}</span>
    </div>
  </div>`;
}
function wireChat(scope){
  const msgs = $("msgs"); if (!msgs) return;
  msgs.scrollTop = msgs.scrollHeight;
  const sel = $("chatScope");
  if (sel) sel.onchange = e => { location.hash = e.target.value === "all" ? "#/" : "#/ai"; chats["_s"] = e.target.value; if (route.v === "ai") renderAi(e.target.value); };
  const push = (r, x) => {
    (chats[scope] = chats[scope] || []).push({r, t:x});
    msgs.insertAdjacentHTML("beforeend", `<div class="msg ${r==="u"?"u":r==="err"?"err":"a"}">${md(x)}</div>`);
    msgs.scrollTop = msgs.scrollHeight;
  };
  const call = async (path, body, shown) => {
    if (shown) push("u", shown);
    msgs.insertAdjacentHTML("beforeend", `<div class="msg a typing" id="typing">${esc(t("ai_think"))}</div>`);
    msgs.scrollTop = msgs.scrollHeight;
    let out;
    try {
      const r = await api(path, {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({...body, restaurant: scope, lang: L})});
      const j = await r.json().catch(() => ({}));
      out = r.ok ? ["a", j.answer] : ["err", t("err_" + ({no_key:"no_key",quota:"quota",busy:"busy"}[j.error] || (r.status===503 ? "data" : "failed")))];
    } catch(e){ out = ["err", t("err_failed")]; }
    const ty = $("typing"); if (ty) ty.remove();
    push(...out);
    const u = usageOf({id:scope}); if (scope !== "all" && ST.usage[scope]) { ST.usage[scope].req++; ST.usage[scope].tokens += 900; saveStore(); }
  };
  const f = $("askf");
  if (f) f.onsubmit = e => { e.preventDefault(); const q = $("q").value.trim(); if (!q) return; $("q").value = ""; call(A("ask"), {question:q}, q); };
  const b = $("brief"); if (b) b.onclick = () => call(A("insights"), {}, "✨ " + t("ai_brief"));
  document.querySelectorAll(".chipbtn").forEach(c => c.onclick = () => call(A("ask"), {question:c.textContent}, c.textContent));
}

let PR = null;
async function drawPricing(){

  try { const r = await fetch("/api?op=pricing"); PR = await r.json(); } catch(e){ PR = {currency:"DZD", plans:[]}; }

function readPricing(){
  const plans = [...document.querySelectorAll("[data-pl]")].map(el => ({

    monthly: +el.querySelector(".pm").value || 0, yearly: +el.querySelector(".py").value || 0,
    features: el.querySelector(".pf").value.split(/\r?\n/).map(x => x.trim()).filter(Boolean),
    featured: el.querySelector(".switch").classList.contains("on")}));
  return {currency: $("prCur").value, plans};

  const cur = PR.currency || "DZD";
  const card = (p, i) => `<div class="card" data-pl="${i}"><div class="card-h"><h3>${esc(t("pr_plan"))} ${i+1}</h3>

    ${PR.plans.length ? PR.plans.map(card).join("") : `<div class="card"><p class="muted">${esc(t("pr_empty"))}</p></div>`}

  document.querySelectorAll("[data-pl] .switch").forEach(b => b.onclick = () => {
    const on = !b.classList.contains("on");

      <div class="row" style="justify-content:space-between;padding:10px 0 2px;border-top:1px solid var(--line-2);margin-top:12px">
        <span>${esc(t("ad_n_mail"))}</span>${checkF("sMail", s.weeklyMail)}</div>`)}</div>`;
    $("sMail").onclick = () => { s.weeklyMail = !s.weeklyMail; $("sMail").classList.toggle("on", s.weeklyMail); saveStore(); toast(t("toast_saved")); };
    bindSave([["sWarn","warnDays","num"],["sOff","warnOffline","num"]], () => { buildNav(); });
  }
  else if (aTab === "security"){
    body.innerHTML = `<div class="stack">${sec(t("ad_sec_h"), `
      <div class="row" style="justify-content:space-between;padding:4px 0">
        <span><b>${esc(t("ad_code"))}</b><br><span class="small muted">${esc(s.codeOn?t("ad_code_on"):t("ad_code_off"))}</span></span>
        ${checkF("sCode", s.codeOn)}</div>
      <div class="row" style="justify-content:space-between;padding:12px 0 4px;border-top:1px solid var(--line-2);margin-top:8px">
        <span><b>${esc(t("ad_2fa"))}</b><br><span class="small muted">${esc(s.twoFa?t("yes"):t("no"))}</span></span>
        ${checkF("s2fa", s.twoFa)}</div>`)}</div>
      <div class="banner acc">${ico("shield")}<span>${esc(t("ad_code_on"))} — ${esc(t("ad_code"))}</span></div>`;
    $("sCode").onclick = () => { s.codeOn = !s.codeOn; $("sCode").classList.toggle("on", s.codeOn); saveStore(); toast(t("toast_saved")); };
    $("s2fa").onclick = () => { s.twoFa = !s.twoFa; $("s2fa").classList.toggle("on", s.twoFa); saveStore(); toast(t("toast_saved")); };
  }
  else if (aTab === "appearance"){
    body.innerHTML = `<div class="stack">${sec(t("ad_app_h"), `
      <div class="field"><label>${esc(t("ad_theme"))}</label>
        <div class="seg" id="sTheme">${[["light","ad_th_light"],["dark","ad_th_dark"],["auto","ad_th_auto"]]
          .map(([k,lb]) => `<button data-k="${k}" class="${s.theme===k?"on":""}">${esc(t(lb))}</button>`).join("")}</div></div>
      <div class="grid g2" style="margin-top:14px">
        ${fld(t("ad_lang"), `<select class="inp" id="sLang">
          <option value="fr" ${s.lang==="fr"?"selected":""}>Français</option>
          <option value="en" ${s.lang==="en"?"selected":""}>English</option>
          <option value="ar" ${s.lang==="ar"?"selected":""}>العربية</option></select>`)}
        ${fld(t("ad_density"), `<select class="inp" id="sDen">
          <option value="comfort" ${s.density==="comfort"?"selected":""}>${esc(t("ad_den_comfort"))}</option>
          <option value="compact" ${s.density==="compact"?"selected":""}>${esc(t("ad_den_compact"))}</option></select>`)}
      </div>`)}</div>`;
    $("sTheme").querySelectorAll("button").forEach(b => b.onclick = () => {
      setTheme(b.dataset.k);
      $("sTheme").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    });
    $("sLang").onchange = e => setLang(e.target.value);
    $("sDen").onchange = e => { s.density = e.target.value; document.body.style.fontSize = e.target.value==="compact" ? "13.5px" : ""; saveStore(); toast(t("toast_saved")); };
  }
  else {
    body.innerHTML = `<div class="stack">${sec(t("ad_data_h"), `
      <div class="row">
        <button class="btn ghost" id="expJ" data-need="export">${ico("download","sm")} ${esc(t("ad_export_json"))}</button>
        <label class="btn ghost" style="cursor:pointer">${ico("upload","sm")} ${esc(t("ad_import"))}
          <input type="file" id="impJ" accept="application/json" hidden></label>
        <div class="sp" style="flex:1"></div>
        <button class="btn danger" id="rstS">${ico("trash","sm")} ${esc(t("ad_reset"))}</button>
      </div>
      <div class="hint acc" style="margin-top:12px">${ico("db","sm")} ${esc(t("ad_sub"))}</div>`)}</div>`;
    $("expJ").onclick = () => {
      const blob = new Blob([JSON.stringify(ST, null, 2)], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = `nardjis-config-${todayISO()}.json`; a.click(); URL.revokeObjectURL(a.href);
      toast(t("ad_exported"));
    };
    $("impJ").onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const j = JSON.parse(rd.result);
          if (!j || typeof j !== "object" || !j.settings) throw 0;
          ST = loadStore(); ST.settings = Object.assign({}, DEFAULT_SETTINGS, j.settings);
          ST.subs = j.subs || ST.subs; ST.team = normTeam(j.team || ST.team);
          ST.incidents = j.incidents || ST.incidents; ST.usage = j.usage || ST.usage;
          saveStore(); applyTheme(); setLang(ST.settings.lang); toast(t("ad_imported"));
        } catch(err){ toast(t("ad_import_err")); }
      };
      rd.readAsText(f);
    };
    $("rstS").onclick = () => {
      if (!confirm(t("ad_reset_t"))) return;
      ST = loadStore(); ST.settings = Object.assign({}, DEFAULT_SETTINGS); saveStore();
      applyTheme(); setLang("fr"); toast(t("ad_reset_done")); renderAdmin();
    };
  }
}
function bindSave(pairs, after){
  const btn = document.createElement("div");
  btn.className = "row"; btn.style.marginTop = "16px";
  btn.innerHTML = `<button class="btn" id="sSave">${ico("check","sm")} ${esc(t("save"))}</button>`;
  $("aBody").appendChild(btn);
  $("sSave").onclick = () => {
    pairs.forEach(([id, key, kind]) => {
      const el = $(id); if (!el) return;
      let v = el.value;
      if (kind === "num") v = Math.max(0, +v || 0);
      ST.settings[key] = v;
    });
    saveStore(); toast(t("ad_saved")); if (after) after(); buildNav();
    if (pairs.some(p => p[1] === "platform") && window.BRAND){
      BRAND.save(ST.settings.platform).then(() => { toast(t("ad_saved")); setTimeout(() => location.reload(), 900); })
        .catch(e => toast(e.message === "setup" ? "Table nj_settings manquante : exécutez le SQL dans Supabase" : e.message === "auth" ? "Reconnectez-vous" : "Erreur : nom non enregistré"));
    }
  };
}

/* ============================================================
   Mount / router dispatch
   ============================================================ */
const STATES = {};
function wireDT(r){
  if (tab === "sub" && ST.subs[r.id]){
    const su = ST.subs[r.id], done = msg => { saveStore(); toast(msg); mount(); buildNav(); };
    const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
    on("subExtend", () => { su.end = addDays(daysBetween(todayISO(), su.end) > 0 ? su.end : todayISO(), 30); su.status = "active"; done(t("sub_started")); });
    on("subSwitch", () => { su.plan = su.plan === "yearly" ? "monthly" : "yearly"; su.price = su.plan === "yearly" ? ST.settings.yearly : ST.settings.monthly; done(t("sub_switched")); });
    on("subCancel", () => { if (!confirm(t("sub_confirm_cancel").replace("{n}", r.name))) return; su.auto = false; su.status = "cancelled"; su.end = addDays(todayISO(), -1); done(t("cancelled")); });
    on("subInv", () => {
      const txt = [`${ST.settings.platform} — ${r.name}`, `${t("plan")} : ${t(su.plan)}`, `${t("price")} : ${money(su.price)}`,
        `${t("rp_col_start")} : ${fmtDate(su.start)}`, `${t("rp_col_end")} : ${fmtDate(su.end)}`].join("\n");
      openDlg(t("sub_invoice"), `<pre>${esc(txt)}</pre>`, `<button class="btn ghost" onclick="closeDlg()">${esc(t("close"))}</button><button class="btn" id="invCopy">${ico("copy","sm")} ${esc(t("tm_copy"))}</button>`);
      $("invCopy").onclick = () => copyText(txt);
    });
  }
  setTimeout(applyPerms, 0);
  if (tab === "room") paintRoom(r);
  if (tab === "activity"){ const b = $("actRep"); if (b) b.onclick = () => showReport(r); }
  if (tab === "health"){ const b = $("incNew"); if (b) b.onclick = () => openIncidentDlg(r.id); }
  document.querySelectorAll("[data-ack]").forEach(b => b.onclick = () => {
    const i = ST.incidents.find(x => x.id === b.dataset.ack); if (i){ i.status = "ack"; saveStore(); toast(t("hl_upd")); mount(); buildNav(); }
  });
  document.querySelectorAll("[data-res]").forEach(b => b.onclick = () => {
    const i = ST.incidents.find(x => x.id === b.dataset.res); if (i){ i.status = "resolved"; saveStore(); toast(t("hl_upd")); mount(); buildNav(); }
  });
}
function crumbCtx(key){
  if (!O) return "";
  const w = ST.settings.warnDays || 14;
  if (key === "home") return `${O.group.online}/${O.group.count} ${t("online")} · ${t("k_expiring")} : ${expiringCount()}`;
  if (key === "restaurants") return `${O.restaurants.length} ${t("rs_count")}`;
  if (key === "reports") return expiringCount() ? `${t("rp_sum_expiring").replace("{d}", w)} : ${expiringCount()}` : `≤ ${w} ${t("days")}`;
  if (key === "analytics") return `${t("an_range")} : ${t("an_" + anRange)}`;
  if (key === "health") return `${t("hl_incidents")} : ${openIncidents().length}`;
  if (key === "team") return `${t("tm_active_m")} : ${ST.team.length}`;
  if (key === "ai") return `${t("usage_req")} : ${O.restaurants.reduce((a,r)=>a+usageOf(r).req,0)}`;
  if (key === "admin") return t("grp_sys");
  return "";
}
function applyPerms(){
  document.querySelectorAll("[data-need]").forEach(el => { if (!can(el.dataset.need)) el.remove(); });
}
function mount(){
  if (!authed || !O) return;   // overview not loaded yet — start() will mount when it arrives
  renderWho(); renderPv();
  if (!can(routePerm(route))){
    const f = firstAllowed();
    if (f){ if (location.hash !== f){ location.hash = f; return; } }
    else { buildNav(); buildMobNav(); $("crumbT").textContent = t("no_access"); $("crumbS").textContent = "";
      $("view").innerHTML = `<div class="card">${emptyBox(t("no_access") + " — " + t("no_access_s"), "shield")}</div>`; return; }
  }
  buildNav(); buildMobNav();
  const key = route.v === "rest" ? "restaurants" : route.v;
  const titles = {home:["ov_title","ov_sub"], restaurants:["rs_title","rs_sub"], reports:["rp_title","rp_sub"],
    analytics:["an_title","an_sub"], health:["hl_title","hl_sub"], team:["tm_title","tm_sub"],
    ai:["ai_title","an_sub"], admin:["ad_title","ad_sub"]};
  const r = route.v === "rest" ? (O.restaurants||[]).find(x => x.id === route.id) : null;
  $("crumbT").textContent = r ? r.name : key === "admin" ? t((SYS.find(z => z[0] === aTab)||SYS[0])[2]) : t((titles[key]||["nav_overview"])[0]);
  $("crumbS").textContent = r
    ? t("nav_restaurants") + " / " + t(DTABS.find(d=>d[0]===tab)?.[1] || "dt_room")
    : crumbCtx(key);

  const sw = $("sw");
  if (O){
    sw.hidden = O.restaurants.length < 2;
    sw.innerHTML = `<option value="">${esc(t("all"))}</option>` +
      O.restaurants.map(x => `<option value="${x.id}" ${route.v==="rest"&&route.id===x.id?"selected":""}>${esc(x.name)}</option>`).join("");
  }

  try {
    if (route.v === "home") renderOverview();
    else if (route.v === "restaurants") renderRestaurants();
    else if (route.v === "rest") renderRest();
    else if (route.v === "reports") renderReports();
    else if (route.v === "analytics") renderAnalytics();
    else if (route.v === "health") renderHealth();
    else if (route.v === "team") renderTeam();
    else if (route.v === "ai") renderAi();
    else if (route.v === "admin") renderAdmin();
    else { location.hash = "#/"; return; }
  } catch(err){
    console.error(err);
    $("view").innerHTML = `<div class="card">${emptyBox(t("err_failed"),"alert")}</div>`;
  }
  applyPerms();
}

/* ============================================================
   Polling
   ============================================================ */
let tickN = 0;
async function tick(force){
  if (!authed) return;
  let firstState = false;
  try {
    const o = await (await api(A("overview"))).json();
    setO(o);
    O.restaurants.forEach(subOf);
    tickN++;
    if (route.v === "rest" && route.id){
      const s = await (await api(A("state", {id:route.id}))).json();
      if (s.waiting === undefined){
        if (!STATES[route.id] && tab !== "room") firstState = true;
        STATES[route.id] = s;
        const r = O.restaurants.find(x => x.id === route.id);
        if (tab === "room"){
          if ($("tables")) paintRoom(r); else if (r) drawDTbody(r);
        }
      }
    }
    // keep states warm for the overview feed (cheap: only every 4th tick, one at a time)
    if (route.v === "home" && tickN % 4 === 0){
      const next = O.restaurants.find(x => !STATES[x.id] && !x.starting);
      if (next){
        try { const s = await (await api(A("state", {id:next.id}))).json(); if (s.waiting === undefined) STATES[next.id] = s; } catch(e){}
      }
    }
    recordHistory();
    // don't blow away the DOM while the user is typing / choosing a value
    const ae = document.activeElement;
    const busy = ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && $("view").contains(ae);
    if (!busy){
      if (force || ["home","restaurants","health"].includes(route.v)) mount();
      else if (route.v === "rest") { if (firstState) mount(); else buildNav(); }
    } else {
      buildNav(); buildMobNav();
    }
  } catch(e){}
}
function recordHistory(){
  if (!O) return;
  const d = todayISO();
  const served = O.restaurants.reduce((a,r) => a + (r.kpi ? r.kpi.served : 0), 0);
  const alerts = O.restaurants.reduce((a,r) => a + (r.kpi ? r.kpi.alerts : 0), 0);
  const ai = O.restaurants.reduce((a,r) => a + usageOf(r).req, 0);
  const prev = ST.history[d];
  if (!prev || served > prev.served) { ST.history[d] = {served, alerts, ai}; saveStore(); }
}

/* ============================================================
   Boot
   ============================================================ */
async function start(){
  try { setO(await (await api(A("overview"))).json()); } catch(e){ return; }
  O.restaurants.forEach(r => { subOf(r); syncLiveUsage(r); });
  parseRoute();
  mount();
  tick();
  setInterval(() => { if (!document.hidden) tick(); }, 3000);
}
function wireShell(){
  $("burger").onclick = () => openSide(!$("side").classList.contains("on"));
  $("scrim").onclick = () => openSide(false);
  $("globeBtn").onclick = e => { e.stopPropagation(); const m = $("globeMenu"); const show = m.hidden; hideMenus(); m.hidden = !show; };
  $("userBtn").onclick = e => { e.stopPropagation(); const m = $("userMenu"); const show = m.hidden; hideMenus(); m.hidden = !show; };
  document.addEventListener("click", e => { if (!e.target.closest(".menu-wrap")) hideMenus(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") hideMenus(); });
  $("themeBtn").onclick = toggleTheme;
  $("miTheme").onclick = () => { toggleTheme(); hideMenus(); };
  $("miLang").onclick = () => { hideMenus(); $("globeMenu").hidden = false; };
  $("logoutBtn").onclick = doLogout;
  $("miOut").onclick = () => { hideMenus(); doLogout(); };
  $("sw").onchange = e => { location.hash = e.target.value ? "#/r/" + e.target.value : "#/"; };
  $("dlgX").onclick = closeDlg;
  $("dlg").addEventListener("click", e => { if (e.target === $("dlg")) closeDlg(); });
  window.dlg = $("dlg"); window.closeDlg = closeDlg; window.toast = toast;
}
async function doLogout(){
  try { await fetch(A("logout"), {method:"POST"}); } catch(e){}
  authed = false; ME = null; viewAs = null; RAW = null; O = null;
  showLogin();
}
(async () => {
  wireShell();
  applyTheme();
  setLang(L);
  renderWho();
  try {
    const a = await (await fetch(A("auth"))).json();
    needCode = a.required; authed = a.ok;
    if (a.member) ME = normTeam([Object.assign({id:"me"}, a.member)]).find(x => x.id === "me" || x.email === a.member.email) || null;
    if (authed) start(); else showLogin(a.configured === false);
  } catch(e){ showLogin(); }
})();
