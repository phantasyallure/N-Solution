<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace établissements — Nardjis</title><link rel="icon" href="/static/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/site.css"></head>
<body class="bg"><div id="hdr"></div>
<main class="wrap"><section class="hero"><div>
<h1>Votre salle sous contrôle, en temps réel.</h1>
<p>Restaurants, cafés, cafétérias : suivez les attentes, le nettoyage et l’effort de votre équipe depuis votre téléphone.</p></div>
<div class="card"><div class="tabs"><button class="on" data-t="l">Gérant</button><button data-t="e">Employé</button><button data-t="s">Créer un compte</button></div>
<form id="fl"><label>E-mail<input name="email" type="email" autocomplete="username" required></label>
<label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
<div class="err"></div><button class="btn">Accéder à mon espace</button></form>
<form id="fe" hidden><label>Identifiant employé<input name="id" required autocapitalize="characters" autocomplete="username" placeholder="ORA-1234"></label>
<label>Code PIN<input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
<div class="err"></div><button class="btn">Voir mes alertes</button></form>
<form id="fs" hidden><label>Nom de l’établissement<input name="business" required maxlength="60"></label>
<div class="g2"><label>Type<select name="type"><option value="restaurant">Restaurant</option><option value="cafeteria">Café / cafétéria</option><option value="other">Autre</option></select></label>
<label>Ville<input name="city" maxlength="60"></label></div>
<label>Votre nom<input name="manager" required maxlength="60"></label>
<label>E-mail<input name="email" type="email" autocomplete="username" required></label>
<label>Mot de passe (8 caractères min.)<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
<div class="err"></div><button class="btn">Créer mon compte</button>
<p class="muted" style="font-size:12px">En créant un compte, vous acceptez notre <a href="/privacy">politique de confidentialité</a>.</p></form></div></section></main>
<div id="ftr"></div><script src="/static/site.js"></script>
<script>
const $=s=>document.querySelector(s),tb=[...document.querySelectorAll(".tabs button")];
const show=k=>{tb.forEach(b=>b.classList.toggle("on",b.dataset.t===k));$("#fl").hidden=k!=="l";$("#fe").hidden=k!=="e";$("#fs").hidden=k!=="s"};
tb.forEach(b=>b.onclick=()=>show(b.dataset.t));if(location.hash==="#signup")show("s");
const MSG={bad_login:"E-mail ou mot de passe incorrect.",email_taken:"Cet e-mail a déjà un compte.",weak:"Mot de passe : 8 caractères minimum.",invalid:"Vérifiez les champs.",busy:"Trop d’essais, patientez une minute.",not_configured:"Service pas encore configuré."};
for(const [id,op] of [["fl","m_login"],["fe","e_login"],["fs","m_signup"]])$("#"+id).onsubmit=async e=>{e.preventDefault();const f=e.target,er=f.querySelector(".err"),b=f.querySelector(".btn");er.textContent="";b.disabled=true;
try{const r=await fetch("/api?op="+op,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(f)))});
if(r.ok)return location.href=op==="e_login"?"/staff":"/app";const j=await r.json().catch(()=>({}));er.textContent=op==="e_login"&&j.error==="bad_login"?"Identifiant ou code incorrect.":MSG[j.error]||"Erreur, réessayez."}catch{er.textContent="Connexion impossible."}b.disabled=false};
</script></body></html>
