<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — Nardjis</title><link rel="icon" href="/static/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/site.css"></head>
<body><div id="hdr"></div><main class="wrap" style="max-width:720px"><h1 class="t">Contact</h1>
<p class="muted" style="margin-top:8px">Une question, une démo, un problème avec votre compte ? Écrivez-nous.</p>
<div class="card" style="margin-top:22px"><form id="f"><label>Votre nom<input name="n" required></label><label>Votre e-mail<input name="e" type="email" required></label>
<label>Message<textarea name="m" rows="5" required style="font:inherit;background:#fffafb;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%"></textarea></label>
<button class="btn">Envoyer</button></form>
<p class="muted" style="margin-top:14px;font-size:13px">Ou directement : <a href="mailto:support@nardjis.com"><b>support@nardjis.com</b></a></p></div></main>
<div id="ftr"></div><script src="/static/site.js"></script>
<script>document.getElementById("f").onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);location.href="mailto:support@nardjis.com?subject="+encodeURIComponent("Contact de "+d.get("n"))+"&body="+encodeURIComponent(d.get("m")+"\n\n"+d.get("n")+" · "+d.get("e"))}</script></body></html>
